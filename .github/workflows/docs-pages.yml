name: Publish Documentation

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs-pages.yml'

permissions:
  contents: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish gh-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number below is the commit count

      - name: Build documentation
        run: |
          set -euo pipefail
          # Like the app ZIPs, the docs ZIP name ends with the build number (the
          # commit count), e.g. Launchstation-Documentation-284.zip. gh-pages is
          # rebuilt from scratch, so no older docs ZIP lingers there.
          build="$(git rev-list --count HEAD)"
          case "${build}" in ''|*[!0-9]*) echo "Invalid build number: ${build}" >&2; exit 1 ;; esac
          docs_zip="Launchstation-Documentation-${build}.zip"
          echo "DOCS_ZIP=${docs_zip}" >> "${GITHUB_ENV}"
          python3 docs-site/build.py \
            --out site \
            --zip "${docs_zip}"
          mkdir -p site/downloads
          cp "${docs_zip}" site/downloads/
          unzip -t "site/downloads/${docs_zip}"

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: Launchstation-Documentation
          path: |
            ${{ env.DOCS_ZIP }}
            site/
          retention-days: 7

      - name: Publish gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf .pages
          mkdir .pages
          cp -a site/. .pages/
          cd .pages
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: publish ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
