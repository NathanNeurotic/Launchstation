      - name: Validate documentation site
        run: |
          python3 docs-site/build.py --out build/docs-site
          test -f build/docs-site/index.html
          test -f build/docs-site/data/search-index.json

      # The ps2build SDK pinned in .github/ps2build-sdk.env (bumped by ps2build-sdk-watch.yml once a week):
      # resolving it makes no network call. The SDK cached under those versions is restored, else an older
      # cached SDK is updated in place, else it is installed: from the official GitHub releases, or when they fail
      # from the pinned NathanNeurotic/old-ps2build-mirror release. Then it is cached. A mirror fallback that does
      # not hold the pinned versions is never cached under them.
      - name: Resolve the pinned ps2build SDK
        env:
          PS2BUILD_SDK_MIRROR_TOKEN: ${{ secrets.PS2BUILD_MIRROR_TOKEN }}
        id: sdk
        run: sh scripts/ps2build_sdk.sh --resolve --llvm "$RUNNER_TEMP/ps2build-sdk.env"
      - name: Restore the ps2build SDK
        if: ${{ !inputs.mirror-drill }}
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.local/share/ps2build
          key: ps2build-sdk-${{ runner.os }}-llvm-${{ steps.sdk.outputs.key }}
          restore-keys: ps2build-sdk-${{ runner.os }}-llvm-

      - name: Install the ps2build SDK
        env:
          PS2BUILD_SDK_MIRROR_TOKEN: ${{ secrets.PS2BUILD_MIRROR_TOKEN }}
          # The official host resets HTTP/2 streams under load; ps2build is a Go binary.
          GODEBUG: http2client=0
          # The drill sends the CLI download to a closed port, so the official attempt fails and the mirror installs.
          PS2BUILD_SDK_OFFICIAL_URL: ${{ inputs.mirror-drill && 'https://127.0.0.1:9' || '' }}
        run: sh scripts/ps2build_sdk.sh --llvm "$HOME/.local/share/ps2build"
      - name: Cache the ps2build SDK
        if: ${{ !inputs.mirror-drill && steps.sdk-cache.outputs.cache-hit != 'true' && env.PS2BUILD_SDK_STALE != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.local/share/ps2build
          key: ps2build-sdk-${{ runner.os }}-llvm-${{ steps.sdk.outputs.key }}

      - name: Verify ps2build
        shell: bash
        run: |
          set -euo pipefail
          command -v ps2build
          # Launchstation release builds use the LLVM/Clang toolchain.
          sdk="$HOME/.local/share/ps2build"
          test -f "$sdk/llvm-toolchain/ee/bin/mips64r5900el-ps2-elf-clang.cfg"
          test -d "$sdk/packages-llvm/core"
          ps2build version
          test -x "$sdk/llvm-toolchain/llvm/bin/llvm-nm"
          echo "LLVM_BIN=$sdk/llvm-toolchain/llvm/bin" >> "$GITHUB_ENV"

      - name: Build native cloud TLS
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_cloud_tls.sh

      - name: Build libjpeg-turbo for the selected toolchain
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_jpeg.sh

      - name: Embed Launchstation Google Drive client
        env:
          WLE_GOOGLE_CLIENT_ID: ${{ secrets.WLE_GOOGLE_CLIENT_ID }}
          WLE_GOOGLE_CLIENT_SECRET: ${{ secrets.WLE_GOOGLE_CLIENT_SECRET }}
        run: |
          python3 scripts/gen_cloud_client.py

      - name: Build isolated PC CARD CF driver
        run: ps2build build -c iop/pccf/ps2.yaml

      - name: Build isolated network socket server
        run: ps2build build -c iop/ps2ips_rpc/ps2.yaml

      - name: Build Launchstation with ps2build
        run: |
          python3 scripts/gen_githash.py --require-git
          sh scripts/fetch_libsmb2.sh
          ps2build build

      - name: Build optional DS34 controller variant
        run: |
          python3 scripts/configure_ds34.py
          ps2build build -c .ps2-ds34.yaml -o build-ds34

      - name: Verify controller variants in linked ELFs
        run: |
          python3 scripts/check_ds34_build.py \
            "$LLVM_BIN/llvm-nm" \
            build/obj/wLaunchELF/wLaunchELF.unstripped.elf \
            build-ds34/obj/wLaunchELF/wLaunchELF.unstripped.elf

      - name: Verify release ELFs contain only Clang-built objects
        run: |
          python3 scripts/check_toolchain_purity.py "$LLVM_BIN/llvm-readobj" \
            build/obj/wLaunchELF/wLaunchELF.unstripped.elf \
            build-ds34/obj/wLaunchELF/wLaunchELF.unstripped.elf \
            build/obj/loader/loader.unstripped.elf \
            build/obj/wle_igr/wle_igr.unstripped.elf \
            build/obj/usbd_ra/usbd_ra.notiopmod.elf \
            build/obj/mmceman/mmceman.notiopmod.elf

      - name: Verify no function stores to its stack before realigning it
        run: |
          python3 scripts/check_stack_realign.py \
            build/obj/wLaunchELF/wLaunchELF.unstripped.elf \
            build-ds34/obj/wLaunchELF/wLaunchELF.unstripped.elf \
            build/obj/loader/loader.unstripped.elf \
            build/obj/wle_igr/wle_igr.unstripped.elf

      - name: Verify recursive file operations keep small stack frames
        run: |
          # The EE main thread has a 128 KB stack. copy() nests up to 16
          # frames on it, and delete() and getFileSize() one per folder level,
          # each with its listing (about 900 KB) on the heap. At these budgets
          # 16 copy() frames take 68 KB.
          # --max-chain adds up the deepest Paste found in the direct calls (once for
          # a host: listing and once for a udpfs: one, which lists through readNetDir):
          # the dashboard opens the classic browser, which pastes a folder 16
          # levels deep (the 16th copy() only refuses, so one frame too many),
          # and the innermost level lists its folder. That chain took 99,792
          # bytes when this was written. The deepest direct calls below the
          # innermost copy() take at most 20,320 bytes more than its listing,
          # so at 104 KB the chain still leaves 4 KB of the stack unused.
          python3 scripts/check_stack_realign.py \
            --max-frame copy=4352 --max-frame delete=3072 --max-frame getFileSize=2048 \
            --max-frame getFilePath=1024 --max-frame browseFilePath=11264 \
            --max-chain '_main,main,DashRun,runLaunchKey,dashRunMisc,dashLaunchApp,ExecuteMainAction,executeBrowserSelection,getFilePath,browseFilePath,subfunc_Paste,copy*16,getDirComplete,listDir,readHOST=106496' \
            --max-chain '_main,main,DashRun,runLaunchKey,dashRunMisc,dashLaunchApp,ExecuteMainAction,executeBrowserSelection,getFilePath,browseFilePath,subfunc_Paste,copy*16,getDirComplete,listDir,readUDPFS,readNetDir=106496' \
            build/obj/wLaunchELF/wLaunchELF.unstripped.elf \
            build-ds34/obj/wLaunchELF/wLaunchELF.unstripped.elf

      - name: Verify source-built UDPFS SMAP and bundled peer ABI
        run: python3 scripts/check_udpfs_smap.py build build-ds34

      - name: Report native cloud size
        run: |
          ee_size="$LLVM_BIN/llvm-size"
          echo "== Mbed TLS archives =="
          ls -lh .cloud-deps/lib/libmbedtls.a .cloud-deps/lib/libmbedx509.a .cloud-deps/lib/libmbedcrypto.a
          echo "== Launchstation sections =="
          "$ee_size" build/bin/wLaunchELF.elf || true
          if [ -f build/bin/wLaunchELF-packed.elf ]; then
            ls -lh build/bin/wLaunchELF-packed.elf
          fi
          # Compare build footprints without stripping features or changing
          # the release publication flow. Sizes are measured after packing.
          {
            echo "### Launchstation ELF footprint (bytes)"
            echo "| Controller variant | Unpacked ELF | Packed ELF |"
            echo "| --- | ---: | ---: |"
            for variant in standard dualshock; do
              if [ "$variant" = standard ]; then dir=build; else dir=build-ds34; fi
              raw="$(stat -c '%s' "$dir/bin/wLaunchELF.elf")"
              packed="$(stat -c '%s' "$dir/bin/wLaunchELF-packed.elf")"
              echo "| $variant | $raw | $packed |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          # Largest symbols (embedded IRX/sounds/fonts, libraries) so ELF size
          # work (#129) targets measured contributors. Report only.
          ee_nm="$LLVM_BIN/llvm-nm"
          echo "== Largest symbols (bytes, hex) =="
          "$ee_nm" --size-sort -S build/obj/wLaunchELF/wLaunchELF.unstripped.elf | tail -n 40 || true

      - name: Check embedded loader low-memory layout
        run: |
          sh scripts/check_loader_layout.sh \
            build/obj/loader/loader.unstripped.elf \
            "$LLVM_BIN/llvm-nm" \
            0x84000 auto auto 0xa0000

      - name: Build installable app packages
        run: |
          python3 scripts/package_apps.py \
            --standard build/bin/wLaunchELF-packed.elf \
            --dualshock build-ds34/bin/wLaunchELF-packed.elf \
            --output artifacts --revision "${GITHUB_SHA}" \
            --epoch "$(git show -s --format=%ct HEAD)"
          python3 tests/test_app_packages.py
          python3 scripts/copy_test_pack.py --output test-fixtures/LS-COPY-TEST.zip

      # LAUNCHSTATION.zip is the full install kit, laid out like RiptOPL's release ZIP:
      # the app under APPS/ with its PSU, POPS/ and EMBER/ pinned to one RiptOPL commit
      # (ship/kit-externals.json, every file SHA-256 checked), the latest upstream Neutrino
      # and the PC-side shortcuts. The ordinary app packages above are unchanged.
      #
      # The kit depends on two downloads (the upstream Neutrino release and the
      # pinned RiptOPL files), so its three steps continue on error: an upstream
      # outage or an incompatible Neutrino release must not block the app ZIPs,
      # PSUs and ELFs. A failed kit leaves no artifacts/LAUNCHSTATION.zip; the
      # publish step then skips LAUNCHSTATION-<build>.zip, keeps the previous
      # build's kit on the release and the notes say so.
      - name: Download the latest Neutrino core
        id: neutrino
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          mkdir -p build/companion
          for attempt in 1 2 3 4; do
            if gh release download latest --repo ps2max32/neutrino --dir build/companion --pattern '*.7z' --clobber; then
              break
            fi
            test "${attempt}" -lt 4 || { echo "::warning::Could not download the Neutrino release; the full kit is skipped" >&2; exit 1; }
            sleep $((attempt * 15))
          done
          mapfile -t cores < <(find build/companion -maxdepth 1 -name 'neutrino_*.7z' -type f)
          test "${#cores[@]}" -eq 1 || { echo "::warning::Expected one neutrino_*.7z, found ${#cores[@]}; the full kit is skipped" >&2; exit 1; }
          echo "NEUTRINO_ARCHIVE=${cores[0]}" >> "$GITHUB_ENV"

      - name: Stage the pinned POPS and EMBER externals
        id: kit_externals
        if: steps.neutrino.outcome == 'success'
        continue-on-error: true
        run: |
          python3 scripts/package_kit.py fetch --cache build/kit-externals \
            || { echo "::warning::Could not stage the pinned POPS/EMBER externals; the full kit is skipped" >&2; exit 1; }

      - name: Package and verify the full install kit
        id: kit
        if: steps.kit_externals.outcome == 'success'
        continue-on-error: true
        run: |
          python3 scripts/package_kit.py package \
            --app-dir artifacts --externals build/kit-externals \
            --neutrino "$NEUTRINO_ARCHIVE" --output artifacts/LAUNCHSTATION.zip \
            --revision "${GITHUB_SHA}" --epoch "$(git show -s --format=%ct HEAD)" \
            --build "$(git rev-list --count HEAD)" \
            || { rm -f artifacts/LAUNCHSTATION.zip; echo "::warning::The full kit failed to package or verify; it is skipped" >&2; exit 1; }

      - name: Report the full kit outcome
        run: |
          if [ -s artifacts/LAUNCHSTATION.zip ]; then
            echo "Full kit: built and verified ($(stat -c '%s' artifacts/LAUNCHSTATION.zip) bytes)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Full kit: NOT built this run (Neutrino download: ${{ steps.neutrino.outcome }}, externals: ${{ steps.kit_externals.outcome }}, package: ${{ steps.kit.outcome }}). App ZIPs, PSUs and ELFs are unaffected." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload copy-test fixtures
        uses: actions/upload-artifact@v4
        with:
          name: Launchstation-copy-test
          path: test-fixtures/LS-COPY-TEST.zip
          retention-days: 7

      - name: Show artifact hashes
        run: sha256sum artifacts/*

      - name: Upload app packages
        uses: actions/upload-artifact@v4
        with:
          name: Launchstation
          path: artifacts/
          retention-days: 1

      - name: Publish rolling release from verified master build
        # Each merge (including squash merges) creates a push to master.
        # PRs build review artifacts but must never overwrite public downloads.
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' && !inputs.mirror-drill
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="latest" # Keep existing website and native-updater download URLs.
          # Every published ZIP name ends with the build number (the commit count),
          # e.g. APP_LAUNCHSTATION-284.zip or LAUNCHSTATION-284.zip (the full kit).
          # The PSUs the native updater downloads and the loose ELFs keep their
          # fixed names.
          build="$(git rev-list --count HEAD)"
          case "${build}" in ''|*[!0-9]*) echo "Invalid build number: ${build}" >&2; exit 1 ;; esac
          for package in APP_LAUNCHSTATION.zip APP_LAUNCHSTATION-DS.zip; do
            test -s "artifacts/${package}" || {
              echo "Missing/empty packaged asset: ${package}" >&2
              exit 1
            }
            cp "artifacts/${package}" "artifacts/${package%.zip}-${build}.zip"
          done
          assets=(
            APP_LAUNCHSTATION.psu
            "APP_LAUNCHSTATION-${build}.zip"
            APP_LAUNCHSTATION-DS.psu
            "APP_LAUNCHSTATION-DS-${build}.zip"
            LAUNCHSTATION.ELF
            LAUNCHSTATION-DS.ELF
            BOOT.ELF
            BOOT2.ELF
          )
          # The full kit is optional: when its steps failed above, publish
          # everything else, keep the previous build's kit attached and let the
          # notes say the kit was not rebuilt.
          kit_published=0
          if [ -s artifacts/LAUNCHSTATION.zip ]; then
            cp artifacts/LAUNCHSTATION.zip "artifacts/LAUNCHSTATION-${build}.zip"
            assets+=("LAUNCHSTATION-${build}.zip")
            kit_published=1
          else
            echo "::warning::LAUNCHSTATION-${build}.zip is not published: the full kit was not built in this run"
          fi

          # All tests, both EE builds, variant checks, memory layout and
          # ZIP/PSU verification already succeeded before this step starts.
          # Do not touch the release for incomplete or superseded builds.
          for asset in "${assets[@]}"; do
            test -s "artifacts/${asset}" || {
              echo "Missing/empty packaged asset: ${asset}" >&2
              exit 1
            }
          done
          remote_master="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq '.object.sha')"
          if [ "${remote_master}" != "${GITHUB_SHA}" ]; then
            echo "Master moved to ${remote_master}; skipping superseded release ${GITHUB_SHA}."
            exit 0
          fi

          # Keep the rolling tag on the same lineage, as expected by the
          # built-in updater's release-ancestry protection.
          previous_sha=""
          if git rev-parse -q --verify "refs/tags/${tag}^{commit}" >/dev/null; then
            previous_sha="$(git rev-parse "refs/tags/${tag}^{commit}")"
            if ! git merge-base --is-ancestor "${previous_sha}" "${GITHUB_SHA}"; then
              echo "Refusing to move ${tag}: ${previous_sha} is not an ancestor of ${GITHUB_SHA}" >&2
              exit 1
            fi
          fi

          title="Launchstation Rolling ${build} - $(date -u +%Y-%m-%d) (${GITHUB_SHA:0:7})"
          notes_file="${RUNNER_TEMP}/launchstation-rolling-notes.md"
          python3 scripts/release_notes.py \
            --repo "${GITHUB_REPOSITORY}" --revision "${GITHUB_SHA}" \
            --previous "${previous_sha}" --run-id "${GITHUB_RUN_ID}" \
            --assets-dir artifacts --output "${notes_file}" --version "${build}"

          # Immutable archive (sd2cloud-style stable-release retention):
          # complete and verify it BEFORE changing any live 'latest' asset.
          # It is deliberately a pre-release so the existing updater and
          # public latest URLs still select the moving release.
          archive_tag="build-${build}"
          # gh release create leaves a lightweight tag, but a tag recreated by
          # hand could be annotated: its ref then points at the tag object, not
          # the commit. Resolve tag objects so a valid archive is never rejected.
          tag_commit() {
            local pair type sha
            pair="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$1" --jq '.object.type + " " + .object.sha')"
            type="${pair%% *}"
            sha="${pair##* }"
            if [ "${type}" = "tag" ]; then
              sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.object.sha')"
            fi
            printf '%s' "${sha}"
          }
          # A tag left behind by a failed archive attempt must never point to
          # another commit: --target does not move an existing Git tag.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${archive_tag}" >/dev/null 2>&1; then
            test "$(tag_commit "${archive_tag}")" = "${GITHUB_SHA}" || {
              echo "Archive tag ${archive_tag} is bound to a different commit." >&2
              exit 1
            }
          fi
          archive_notes="${RUNNER_TEMP}/launchstation-archive-notes.md"
          {
            printf 'Verified Launchstation build %s (%s).\n\n' "${build}" "${GITHUB_SHA}"
            printf 'This build is retained for recovery; the moving [latest release](https://github.com/%s/releases/tag/latest) remains the default channel.\n\n' "${GITHUB_REPOSITORY}"
            printf 'The artifacts below were validated before the rolling release was updated. The full kit is present only when this build produced it.\n\n'
            printf '```text\n'
            for asset in "${assets[@]}"; do
              sha256sum "artifacts/${asset}" | sed 's#artifacts/##'
            done
            printf '```\n'
          } > "${archive_notes}"
          archive_existing=0
          if gh release view "${archive_tag}" >/dev/null 2>&1; then
            archive_existing=1
            # A repeated run may only reuse the EXACT same immutable commit.
            test "$(tag_commit "${archive_tag}")" = "${GITHUB_SHA}" || {
              echo "Archive tag ${archive_tag} does not match this build; refusing publication." >&2
              exit 1
            }
          else
            archive_uploads=()
            for asset in "${assets[@]}"; do archive_uploads+=("artifacts/${asset}"); done
            gh release create "${archive_tag}" "${archive_uploads[@]}" \
              --title "Launchstation Build ${build} (${GITHUB_SHA:0:7})" \
              --notes-file "${archive_notes}" --target "${GITHUB_SHA}" \
              --prerelease --latest=false
          fi
          # Reusing a verified archive must be safe even when optional
          # Neutrino/kit dependencies change between attempts. Never rewrite
          # the archive or let a mismatched optional kit hold up the core apps.
          if [ "${archive_existing}" = 1 ] && [ "${kit_published}" = 1 ]; then
            kit_asset="LAUNCHSTATION-${build}.zip"
            old_kit_digest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${archive_tag}" \
              --jq ".assets[] | select(.name == \"${kit_asset}\") | .digest")"
            current_kit_digest="sha256:$(sha256sum "artifacts/${kit_asset}" | cut -d' ' -f1)"
            if [ "${old_kit_digest}" != "${current_kit_digest}" ]; then
              echo "::warning::Optional kit differs from immutable archive (or was absent); retaining existing rolling kit and publishing core apps only."
              kept_assets=()
              for asset in "${assets[@]}"; do
                [ "${asset}" = "${kit_asset}" ] || kept_assets+=("${asset}")
              done
              assets=("${kept_assets[@]}")
              kit_published=0
              python3 scripts/release_notes.py \
                --repo "${GITHUB_REPOSITORY}" --revision "${GITHUB_SHA}" \
                --previous "${previous_sha}" --run-id "${GITHUB_RUN_ID}" \
                --assets-dir artifacts --output "${notes_file}" \
                --version "${build}" --omit-kit
            fi
          fi
          # Verify the archive tag again AFTER create: an existing tag
          # never moves just because gh release create was given --target.
          test "$(tag_commit "${archive_tag}")" = "${GITHUB_SHA}" || {
            echo "Archive tag ${archive_tag} does not match ${GITHUB_SHA}; refusing publication." >&2
            exit 1
          }
          # GitHub computes the SHA-256 asset digest. Compare those remote
          # digests and byte sizes with the tested build WITHOUT downloading
          # (downloads done by CI would inflate the public count).
          for asset in "${assets[@]}"; do
            remote_size="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${archive_tag}" \
              --jq ".assets[] | select(.name == \"${asset}\") | .size")"
            remote_digest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${archive_tag}" \
              --jq ".assets[] | select(.name == \"${asset}\") | .digest")"
            expected_size="$(stat -c '%s' "artifacts/${asset}")"
            expected_digest="sha256:$(sha256sum "artifacts/${asset}" | cut -d' ' -f1)"
            if [ "${remote_size}" != "${expected_size}" ] || [ "${remote_digest}" != "${expected_digest}" ]; then
              if [ -z "${remote_size}" ] || [ -z "${remote_digest}" ]; then
                echo "Archive ${archive_tag} is missing asset ${asset}; latest is unchanged. Inspect the archive, then either upload the missing tested asset to the ${archive_tag} pre-release or delete that archive release and rerun the workflow." >&2
              else
                echo "Archive integrity failure for ${asset}: size ${remote_size}/${expected_size}, digest ${remote_digest}/${expected_digest}. Refusing to modify latest. A mismatched archived asset is never overwritten; inspect ${archive_tag} and either restore the tested asset or delete the archive release and rerun the workflow." >&2
              fi
              exit 1
            fi
          done
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${archive_tag}" --jq '.prerelease')" = true
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${archive_tag}" --jq '.draft')" = false
          echo "Verified immutable archive ${archive_tag} before moving latest."

          # A moving release retains its canonical asset names so both
          # existing download links and the updater continue to resolve.
          upload_paths=()
          for asset in "${assets[@]}"; do upload_paths+=("artifacts/${asset}"); done
          # Persist per-asset download counts before --clobber removes the old
          # IDs. A failed snapshot MUST block publication or those counters
          # become unrecoverable. The metrics branch does not trigger a build.
          # Create a missing latest only AFTER the snapshot, so a metrics
          # outage cannot leave an empty canonical release behind.
          python3 scripts/download_metrics.py --repo "${GITHUB_REPOSITORY}"

          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" --title "${title}" \
              --notes-file "${notes_file}" --target "${GITHUB_SHA}" --latest
          fi
          gh release upload "${tag}" "${upload_paths[@]}" --clobber

          # Verify the exact uploaded bytes via GitHub's SERVER-COMPUTED SHA-256
          # digest and size. Do not download our own release assets for CI:
          # that increments GitHub's public download_count and pollutes metrics.
          for asset in "${assets[@]}"; do
            expected="$(stat -c '%s' "artifacts/${asset}")"
            actual="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
              --jq ".assets[] | select(.name == \"${asset}\") | .size")"
            expected_digest="sha256:$(sha256sum "artifacts/${asset}" | cut -d' ' -f1)"
            actual_digest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
              --jq ".assets[] | select(.name == \"${asset}\") | .digest")"
            if [ "${expected}" != "${actual}" ] || [ "${expected_digest}" != "${actual_digest}" ]; then
              echo "Release asset verification failed: ${asset}, size ${actual}/${expected}, digest ${actual_digest}/${expected_digest}" >&2
              exit 1
            fi
          done

          remote_master="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq '.object.sha')"
          if [ "${remote_master}" != "${GITHUB_SHA}" ]; then
            echo "Master advanced during asset upload. Not moving rolling tag to a superseded commit." >&2
            exit 1
          fi

          # Only now point the moving source tag and public release at this
          # exact tested build. Mark it Latest and not a pre-release, like RiptOPL.
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" \
            -f sha="${GITHUB_SHA}" -F force=true
          # GitHub shows a release's published_at, which edits never change, so
          # the page kept the original creation date. Briefly drafting then
          # re-publishing the same release refreshes that date while keeping
          # its id, assets, reactions and download counts. If publishing fails,
          # restore the release so the updater's download URLs do not stay 404.
          gh release edit "${tag}" --draft=true
          if ! gh release edit "${tag}" --title "${title}" \
            --notes-file "${notes_file}" --target "${GITHUB_SHA}" \
            --draft=false --prerelease=false --latest; then
            gh release edit "${tag}" --draft=false --prerelease=false --latest || true
            echo "Failed to re-publish ${tag}" >&2
            exit 1
          fi
          # Read back what was published. GitHub can briefly serve the old
          # value right after a write, so retry before failing, and name the
          # check and the value read if it still does not match.
          for check in "git/ref/tags/${tag} .object.sha ${GITHUB_SHA}" "releases/tags/${tag} .prerelease false"; do
            set -- ${check}
            for try in 1 2 3 4 5; do
              got="$(gh api "repos/${GITHUB_REPOSITORY}/$1" --jq "$2" || true)"
              [ "${got}" = "$3" ] && break
              [ "${try}" = 5 ] && { echo "Published ${tag}, but $1 $2 reads '${got}', expected '$3'" >&2; exit 1; }
              sleep 3
            done
          done
          # Versioned ZIP names change with every build, so remove the old
          # fixed-name ZIPs and the app ZIPs of OLDER builds only: a newer build's
          # ZIPs and any other manually maintained attachment stay. This runs only
          # after publishing succeeded, and a failed delete only warns. Older
          # LAUNCHSTATION-*.zip kits are removed only when this build published
          # its own kit, so the release always keeps one.
          { gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.assets[].name' \
              || echo "::warning::could not list release assets; stale ZIPs were left" >&2; } |
            while IFS= read -r name; do
              stale=0
              case "${name}" in
                APP_LAUNCHSTATION.zip|APP_LAUNCHSTATION-DS.zip|LAUNCHSTATION.zip) stale=1 ;;
                APP_LAUNCHSTATION-*.zip|LAUNCHSTATION-*.zip)
                  number="${name%.zip}"
                  number="${number##*-}"
                  case "${name}" in
                    "APP_LAUNCHSTATION-${number}.zip"|"APP_LAUNCHSTATION-DS-${number}.zip"|"LAUNCHSTATION-${number}.zip")
                      case "${number}" in
                        ''|*[!0-9]*) ;;
                        *) [ "${number}" -lt "${build}" ] && stale=1 ;;
                      esac ;;
                  esac ;;
              esac
              case "${name}" in
                LAUNCHSTATION.zip|LAUNCHSTATION-*.zip) [ "${kit_published}" = 1 ] || stale=0 ;;
              esac
              if [ "${stale}" = 1 ]; then
                gh release delete-asset "${tag}" "${name}" --yes \
                  || echo "::warning::could not remove stale asset ${name}"
              fi
            done
          echo "Published Launchstation Rolling ${build} (${GITHUB_SHA}) as GitHub Latest."
          echo "Release page date (published_at): $(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.published_at')"
