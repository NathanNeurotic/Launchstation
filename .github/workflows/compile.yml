          python3 tests/test_unified_dashboard_navigation.py
          python3 tests/test_files_tab_lifecycle.py
          python3 tests/test_bgm_sidecar.py
          python3 tests/test_sound_recovery.py
          python3 tests/test_sfx_ps2.py
          python3 tests/test_mc_card_view.py
          python3 tests/test_mc_fingerprint.py
