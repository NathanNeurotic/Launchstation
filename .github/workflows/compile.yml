          python3 tests/test_portable_filename.py
          python3 tests/test_editor_keyboard.py
          python3 tests/test_font_weight.py
          python3 tests/test_browser_sort.py
          python3 tests/test_video_sound_preview.py
          python3 tests/test_display_feedback.py
          python3 tests/test_udpfs_smap_fifo_tail.py
          python3 tests/test_udpfs_smap_startup.py
          python3 tests/test_pccf.py
          python3 tests/test_pccf_owner.py
          python3 tests/test_pccf_fs.py
          python3 tests/test_copy_short_io.py
          python3 tests/test_copy_pipeline.py
          python3 tests/test_udpfs_directory_errors.py
          python3 tests/test_smb_shares.py
          python3 tests/test_copy_test_pack.py
