name: Automated-Build

on:
  workflow_dispatch:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build:
    name: Build wLaunchELF (ps2build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ps2build SDK
        shell: bash
        run: |
          set -euo pipefail
          installer="$(mktemp)"
          trap 'rm -f "$installer"' EXIT

          # git.techwritescode.dev occasionally returns transient 5xx errors.
          # Retry the download before failing the job, and never let a failed
          # curl be hidden by the pipe into sh.
          curl -sSfL \
            --retry 8 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 20 \
            https://git.techwritescode.dev/ps2/install/raw/branch/master/install.sh \
            -o "$installer"

          sh "$installer"
          echo "$HOME/.local/share/ps2build" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/ps2build/bin" >> "$GITHUB_PATH"

      - name: Verify ps2build
        shell: bash
        run: |
          set -euo pipefail
          PS2BUILD="$HOME/.local/share/ps2build/bin/ps2build"
          test -x "$PS2BUILD"
          "$PS2BUILD" --version

      - name: Install in-repo custom packages
        run: |
          dest="$HOME/.local/share/ps2build/packages/world"
          mkdir -p "$dest"
          cp -r packages/world/. "$dest/"
          ls "$dest"

      - name: Build wLaunchELF with ps2build
        run: |
          ps2build build

      - name: Prepare ELF artifacts
        run: |
          ls -la build/bin/
          if [ ! -f "build/bin/wLaunchELF-packed.elf" ]; then
            echo "Expected build/bin/wLaunchELF-packed.elf was not produced!" >&2
            exit 1
          fi
          mkdir -p artifacts
          cp build/bin/wLaunchELF-packed.elf artifacts/BOOT.ELF
          cp build/bin/wLaunchELF-packed.elf artifacts/wLaunchELF_R3Z.ELF
          if [ -f "build/bin/wLaunchELF.elf" ]; then
            cp build/bin/wLaunchELF.elf artifacts/wLaunchELF_R3Z-unpacked.ELF
          fi
          ls -lh artifacts/

      - name: Show artifact hashes
        run: sha256sum artifacts/*

      - name: Upload ELF artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: wLaunchELF_R3Z
          path: artifacts/
          retention-days: 1

      - name: Publish latest automated pre-release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="latest"
          title="Latest automated build"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$title" --notes "Automated build for ${GITHUB_SHA} using ps2build" --target "${GITHUB_SHA}" --prerelease || true
          fi
          gh release upload "$tag" artifacts/* --clobber || true

      - name: Publish branch preview pre-release
        # Non-master pushes (feature branches) get their own rolling
        # prerelease, published by CI from the artifact it just built.
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="${GITHUB_REF_NAME}"
          short="${branch#nathan/}"
          short="${short#feature/}"
          tag="preview-$(echo "$short" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]\+/-/g')"
          title="Preview build: ${short}"
          notes="Automated preview of ${branch} (${GITHUB_SHA}). Packed ELF (BOOT.ELF / wLaunchELF_R3Z.ELF) is the one to test; see the CI run for sha256 hashes."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/* --clobber
            gh release edit "$tag" --title "$title" --notes "$notes" --target "${GITHUB_SHA}"
          else
            gh release create "$tag" artifacts/BOOT.ELF artifacts/wLaunchELF_R3Z.ELF artifacts/wLaunchELF_R3Z-unpacked.ELF \
              --title "$title" --notes "$notes" --target "${GITHUB_SHA}" --prerelease
          fi

      - name: Publish language files release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="language-files"
          title="Translations"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title"
          else
            gh release create "$tag" --title "$title" --notes "Automated language files for ${GITHUB_SHA}" --target "${GITHUB_SHA}"
          fi
          mapfile -d '' assets < <(find Lang -type f -name '*.LNG' -print0)
          if [ "${#assets[@]}" -gt 0 ]; then
            gh release upload "$tag" "${assets[@]}" --clobber
          fi
