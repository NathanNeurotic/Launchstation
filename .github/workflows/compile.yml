          python3 tests/test_mmce_native_import.py
          python3 tests/test_mmce_rename_fallback.py
          python3 tests/test_mmce_selectable_install.py
          python3 tests/test_mmce_exclusive_new_files.py
          python3 tests/test_loader_linkfile.py
          python3 tests/test_sd2cloud_parity.py
