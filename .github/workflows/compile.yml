          python3 scripts/copy_test_pack.py --output test-fixtures/LS-COPY-TEST.zip
          python3 tests/test_rolling_release_workflow.py
          python3 tests/test_llvm_toolchain.py
          python3 tests/test_release_notes.py
          python3 tests/test_update_sidecar_transaction.py
          python3 tests/test_update_ancestry.py
          python3 tests/test_png_viewer.py
          python3 tests/test_bookmark_routes.py
          python3 tests/test_classic_settings_persistence.py
          python3 tests/test_elisa_font_load.py
          python3 tests/test_ember_gameid.py
          python3 tests/test_ember_retrogem_handoff.py
          python3 tests/test_misc_settings_dispatch.py
          python3 tests/test_navigation_wraparound.py
          python3 tests/test_popstarter_retrogem.py
          python3 tests/test_r3z_browser_contract.py
          python3 tests/test_r3z_config_inventory.py
          python3 tests/test_r3z_video_switch.py
          python3 tests/test_cdvd_scmd_buffers.py
          python3 tests/test_sjis_dashboard_titles.py
          python3 tests/test_zack_launch_sizing.py

      - name: Validate documentation site
        run: |
          python3 docs-site/build.py --out build/docs-site
          test -f build/docs-site/index.html
          test -f build/docs-site/data/search-index.json

      # The newest ps2build SDK: the latest versions come from git.techwritescode.dev's release API (or,
      # when it is down, the newest NathanNeurotic/ps2build-mirror release). The SDK cached under them is
      # restored, else an older cached SDK is updated in place, else it is installed; then it is cached. A
      # mirror fallback older than the latest is never cached under the latest versions.
      - name: Resolve the latest ps2build SDK
        id: sdk
        run: sh scripts/ps2build_sdk.sh --resolve --llvm "$RUNNER_TEMP/ps2build-sdk.env"
      - name: Restore the ps2build SDK
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.local/share/ps2build
          key: ps2build-sdk-${{ runner.os }}-llvm-${{ steps.sdk.outputs.key }}
          restore-keys: ps2build-sdk-${{ runner.os }}-llvm-

      - name: Install the ps2build SDK
        env:
          # The official host resets HTTP/2 streams under load; ps2build is a Go binary.
          GODEBUG: http2client=0
        run: sh scripts/ps2build_sdk.sh --llvm "$HOME/.local/share/ps2build"
      - name: Cache the ps2build SDK
        if: ${{ steps.sdk-cache.outputs.cache-hit != 'true' && env.PS2BUILD_SDK_STALE != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.local/share/ps2build
          key: ps2build-sdk-${{ runner.os }}-llvm-${{ steps.sdk.outputs.key }}

      - name: Verify ps2build
        shell: bash
        run: |
          set -euo pipefail
          command -v ps2build
          # Launchstation release builds use the LLVM/Clang toolchain.
          sdk="$HOME/.local/share/ps2build"
          test -f "$sdk/llvm-toolchain/ee/bin/mips64r5900el-ps2-elf-clang.cfg"
          test -d "$sdk/packages-llvm/core"
          ps2build version
          test -x "$sdk/llvm-toolchain/llvm/bin/llvm-nm"
          echo "LLVM_BIN=$sdk/llvm-toolchain/llvm/bin" >> "$GITHUB_ENV"

      - name: Build native cloud TLS
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_cloud_tls.sh

      - name: Build libjpeg-turbo for the selected toolchain
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_jpeg.sh

      - name: Embed Launchstation Google Drive client
        env:
          WLE_GOOGLE_CLIENT_ID: ${{ secrets.WLE_GOOGLE_CLIENT_ID }}
          WLE_GOOGLE_CLIENT_SECRET: ${{ secrets.WLE_GOOGLE_CLIENT_SECRET }}
        run: |
          python3 scripts/gen_cloud_client.py

      - name: Build isolated PC CARD CF driver
        run: ps2build build -c iop/pccf/ps2.yaml

      - name: Build isolated network socket server
        run: ps2build build -c iop/ps2ips_rpc/ps2.yaml

      - name: Build Launchstation with ps2build
        run: |
          python3 scripts/gen_githash.py --require-git
          ps2build build

      - name: Build optional DS34 controller variant
        run: |
          python3 scripts/configure_ds34.py
          ps2build build -c .ps2-ds34.yaml -o build-ds34

      - name: Verify controller variants in linked ELFs
        run: |
          python3 scripts/check_ds34_build.py \
            "$LLVM_BIN/llvm-nm" \
            build/obj/wLaunchELF/wLaunchELF.unstripped.elf \
            build-ds34/obj/wLaunchELF/wLaunchELF.unstripped.elf

      - name: Verify release ELFs contain only Clang-built objects
        run: |
          python3 scripts/check_toolchain_purity.py "$LLVM_BIN/llvm-readobj" \
            build/obj/wLaunchELF/wLaunchELF.unstripped.elf \
            build-ds34/obj/wLaunchELF/wLaunchELF.unstripped.elf \
            build/obj/loader/loader.unstripped.elf \
            build/obj/wle_igr/wle_igr.unstripped.elf \
            build/obj/usbd_ra/usbd_ra.notiopmod.elf \
            build/obj/mmceman/mmceman.notiopmod.elf

      - name: Verify source-built UDPFS SMAP and bundled peer ABI
        run: python3 scripts/check_udpfs_smap.py build build-ds34

      - name: Report native cloud size
        run: |
          ee_size="$LLVM_BIN/llvm-size"
          echo "== Mbed TLS archives =="
          ls -lh .cloud-deps/lib/libmbedtls.a .cloud-deps/lib/libmbedx509.a .cloud-deps/lib/libmbedcrypto.a
          echo "== Launchstation sections =="
          "$ee_size" build/bin/wLaunchELF.elf || true
          if [ -f build/bin/wLaunchELF-packed.elf ]; then
            ls -lh build/bin/wLaunchELF-packed.elf
          fi
          # Compare build footprints without stripping features or changing
          # the release publication flow. Sizes are measured after packing.
          {
            echo "### Launchstation ELF footprint (bytes)"
            echo "| Controller variant | Unpacked ELF | Packed ELF |"
            echo "| --- | ---: | ---: |"
            for variant in standard dualshock; do
              if [ "$variant" = standard ]; then dir=build; else dir=build-ds34; fi
              raw="$(stat -c '%s' "$dir/bin/wLaunchELF.elf")"
              packed="$(stat -c '%s' "$dir/bin/wLaunchELF-packed.elf")"
              echo "| $variant | $raw | $packed |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          # Largest symbols (embedded IRX/sounds/fonts, libraries) so ELF size
          # work (#129) targets measured contributors. Report only.
          ee_nm="$LLVM_BIN/llvm-nm"
          echo "== Largest symbols (bytes, hex) =="
          "$ee_nm" --size-sort -S build/obj/wLaunchELF/wLaunchELF.unstripped.elf | tail -n 40 || true

      - name: Check embedded loader low-memory layout
        run: |
          sh scripts/check_loader_layout.sh \
            build/obj/loader/loader.unstripped.elf \
            "$LLVM_BIN/llvm-nm" \
            0x84000 auto auto 0xa0000

      - name: Build installable app packages
        run: |
          python3 scripts/package_apps.py \
            --standard build/bin/wLaunchELF-packed.elf \
            --dualshock build-ds34/bin/wLaunchELF-packed.elf \
            --output artifacts --revision "${GITHUB_SHA}" \
            --epoch "$(git show -s --format=%ct HEAD)"
          python3 tests/test_app_packages.py
          python3 scripts/copy_test_pack.py --output test-fixtures/LS-COPY-TEST.zip

      # LAUNCHSTATION.zip is the full install kit, laid out like RiptOPL's release ZIP:
      # the app under APPS/ with its PSU, POPS/ and EMBER/ pinned to one RiptOPL commit
      # (ship/kit-externals.json, every file SHA-256 checked), the latest upstream Neutrino
      # and the PC-side shortcuts. The ordinary app packages above are unchanged.
      - name: Download the latest Neutrino core
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          mkdir -p build/companion
          for attempt in 1 2 3 4; do
            if gh release download latest --repo ps2max32/neutrino --dir build/companion --pattern '*.7z' --clobber; then
              break
            fi
            test "${attempt}" -lt 4 || { echo "Could not download the Neutrino release" >&2; exit 1; }
            sleep $((attempt * 15))
          done
          mapfile -t cores < <(find build/companion -maxdepth 1 -name 'neutrino_*.7z' -type f)
          test "${#cores[@]}" -eq 1 || { echo "Expected one neutrino_*.7z, found ${#cores[@]}" >&2; exit 1; }
          echo "NEUTRINO_ARCHIVE=${cores[0]}" >> "$GITHUB_ENV"

      - name: Stage the pinned POPS and EMBER externals
        run: python3 scripts/package_kit.py fetch --cache build/kit-externals

      - name: Package and verify the full install kit
        run: |
          python3 scripts/package_kit.py package \
            --app-dir artifacts --externals build/kit-externals \
            --neutrino "$NEUTRINO_ARCHIVE" --output artifacts/LAUNCHSTATION.zip \
            --revision "${GITHUB_SHA}" --epoch "$(git show -s --format=%ct HEAD)" \
            --build "$(git rev-list --count HEAD)"

      - name: Upload copy-test fixtures
        uses: actions/upload-artifact@v4
        with:
          name: Launchstation-copy-test
          path: test-fixtures/LS-COPY-TEST.zip
          retention-days: 7

      - name: Show artifact hashes
        run: sha256sum artifacts/*

      - name: Upload app packages
        uses: actions/upload-artifact@v4
        with:
          name: Launchstation
          path: artifacts/
          retention-days: 1

      - name: Publish rolling release from verified master build
        # Each merge (including squash merges) creates a push to master.
        # PRs build review artifacts but must never overwrite public downloads.
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="latest" # Keep existing website and native-updater download URLs.
          # Every published ZIP name ends with the build number (the commit count),
          # e.g. APP_LAUNCHSTATION-284.zip or LAUNCHSTATION-284.zip (the full kit).
          # The PSUs the native updater downloads and the loose ELFs keep their
          # fixed names.
          build="$(git rev-list --count HEAD)"
          case "${build}" in ''|*[!0-9]*) echo "Invalid build number: ${build}" >&2; exit 1 ;; esac
          for package in APP_LAUNCHSTATION.zip APP_LAUNCHSTATION-DS.zip LAUNCHSTATION.zip; do
            test -s "artifacts/${package}" || {
              echo "Missing/empty packaged asset: ${package}" >&2
              exit 1
            }
            cp "artifacts/${package}" "artifacts/${package%.zip}-${build}.zip"
          done
          assets=(
            APP_LAUNCHSTATION.psu
            "APP_LAUNCHSTATION-${build}.zip"
            APP_LAUNCHSTATION-DS.psu
            "APP_LAUNCHSTATION-DS-${build}.zip"
            "LAUNCHSTATION-${build}.zip"
            LAUNCHSTATION.ELF
            LAUNCHSTATION-DS.ELF
            BOOT.ELF
            BOOT2.ELF
          )

          # All tests, both EE builds, variant checks, memory layout and
          # ZIP/PSU verification already succeeded before this step starts.
          # Do not touch the release for incomplete or superseded builds.
          for asset in "${assets[@]}"; do
            test -s "artifacts/${asset}" || {
              echo "Missing/empty packaged asset: ${asset}" >&2
              exit 1
            }
          done
          remote_master="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq '.object.sha')"
          if [ "${remote_master}" != "${GITHUB_SHA}" ]; then
            echo "Master moved to ${remote_master}; skipping superseded release ${GITHUB_SHA}."
            exit 0
          fi

          # Keep the rolling tag on the same lineage, as expected by the
          # built-in updater's release-ancestry protection.
          previous_sha=""
          if git rev-parse -q --verify "refs/tags/${tag}^{commit}" >/dev/null; then
            previous_sha="$(git rev-parse "refs/tags/${tag}^{commit}")"
            if ! git merge-base --is-ancestor "${previous_sha}" "${GITHUB_SHA}"; then
              echo "Refusing to move ${tag}: ${previous_sha} is not an ancestor of ${GITHUB_SHA}" >&2
              exit 1
            fi
          fi

          title="Launchstation Rolling ${build} - $(date -u +%Y-%m-%d) (${GITHUB_SHA:0:7})"
          notes_file="${RUNNER_TEMP}/launchstation-rolling-notes.md"
          python3 scripts/release_notes.py \
            --repo "${GITHUB_REPOSITORY}" --revision "${GITHUB_SHA}" \
            --previous "${previous_sha}" --run-id "${GITHUB_RUN_ID}" \
            --assets-dir artifacts --output "${notes_file}" --version "${build}"

          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" --title "${title}" \
              --notes-file "${notes_file}" --target "${GITHUB_SHA}" --latest
          fi

          # A moving release retains its canonical asset names so both
          # existing download links and the updater continue to resolve.
          upload_paths=()
          for asset in "${assets[@]}"; do upload_paths+=("artifacts/${asset}"); done
          gh release upload "${tag}" "${upload_paths[@]}" --clobber

          # Validate that every public asset has the exact packaged byte size
          # before moving the tag or claiming a successful release. Keep any
          # unrelated manually maintained attachments intact.
          verify_dir="${RUNNER_TEMP}/launchstation-published-assets"
          mkdir -p "${verify_dir}"
          for asset in "${assets[@]}"; do
            expected="$(stat -c '%s' "artifacts/${asset}")"
            actual="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
              --jq ".assets[] | select(.name == \"${asset}\") | .size")"
            if [ "${expected}" != "${actual}" ]; then
              echo "Release asset size verification failed: ${asset}, local=${expected}, remote=${actual}" >&2
              exit 1
            fi
            # Download the actual published bytes; a matching length alone
            # does not prove an upload was intact or from this build.
            gh release download "${tag}" --pattern "${asset}" \
              --dir "${verify_dir}" --clobber
            if ! cmp -s "artifacts/${asset}" "${verify_dir}/${asset}"; then
              echo "Release asset content differs from the compiled package: ${asset}" >&2
              exit 1
            fi
          done

          remote_master="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq '.object.sha')"
          if [ "${remote_master}" != "${GITHUB_SHA}" ]; then
            echo "Master advanced during asset upload. Not moving rolling tag to a superseded commit." >&2
            exit 1
          fi

          # Only now point the moving source tag and public release at this
          # exact tested build. Mark it Latest and not a pre-release, like RiptOPL.
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" \
            -f sha="${GITHUB_SHA}" -F force=true
          # GitHub shows a release's published_at, which edits never change, so
          # the page kept the original creation date. Briefly drafting then
          # re-publishing the same release refreshes that date while keeping
          # its id, assets, reactions and download counts. If publishing fails,
          # restore the release so the updater's download URLs do not stay 404.
          gh release edit "${tag}" --draft=true
          if ! gh release edit "${tag}" --title "${title}" \
            --notes-file "${notes_file}" --target "${GITHUB_SHA}" \
            --draft=false --prerelease=false --latest; then
            gh release edit "${tag}" --draft=false --prerelease=false --latest || true
            echo "Failed to re-publish ${tag}" >&2
            exit 1
          fi
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha')" = "${GITHUB_SHA}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.prerelease')" = "false"
          # Versioned ZIP names change with every build, so remove the old
          # fixed-name ZIPs and the app ZIPs of OLDER builds only: a newer build's
          # ZIPs and any other manually maintained attachment stay. This runs only
          # after publishing succeeded, and a failed delete only warns.
          { gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.assets[].name' \
              || echo "::warning::could not list release assets; stale ZIPs were left" >&2; } |
            while IFS= read -r name; do
              stale=0
              case "${name}" in
                APP_LAUNCHSTATION.zip|APP_LAUNCHSTATION-DS.zip|LAUNCHSTATION.zip) stale=1 ;;
                APP_LAUNCHSTATION-*.zip|LAUNCHSTATION-*.zip)
                  number="${name%.zip}"
                  number="${number##*-}"
                  case "${name}" in
                    "APP_LAUNCHSTATION-${number}.zip"|"APP_LAUNCHSTATION-DS-${number}.zip"|"LAUNCHSTATION-${number}.zip")
                      case "${number}" in
                        ''|*[!0-9]*) ;;
                        *) [ "${number}" -lt "${build}" ] && stale=1 ;;
                      esac ;;
                  esac ;;
              esac
              if [ "${stale}" = 1 ]; then
                gh release delete-asset "${tag}" "${name}" --yes \
                  || echo "::warning::could not remove stale asset ${name}"
              fi
            done
          echo "Published Launchstation Rolling ${build} (${GITHUB_SHA}) as GitHub Latest."
          echo "Release page date (published_at): $(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.published_at')"
