          python3 tests/test_build_identity.py
          python3 tests/test_clock_save_action.py
          python3 tests/test_clock_sync.py
          python3 tests/test_storage_probe_frames.py
          python3 tests/test_mmce_bus_restore.py
          python3 tests/test_poweroff_init.py
          python3 tests/test_settings_save_prompt.py
          python3 tests/test_settings_navigation.py
          python3 tests/test_zack_feedback.py
          python3 tests/test_software_clock.py
          python3 tests/test_startup_status.py
          python3 tests/test_transition_latency.py
          python3 tests/test_native_four_browser_modes.py
          python3 tests/test_feedback_35_82.py
          python3 tests/test_ilink_browser.py
          python3 tests/test_neutrino_iso.py
          python3 tests/test_neutrino_smb.py
          python3 tests/test_r3z_loader_disable.py
          python3 tests/test_r3z_neutrino_options.py
          python3 tests/test_neutrino_profiles.py
          python3 tests/test_neutrino_cancel_feedback.py
          python3 tests/test_r3z_neutrino_gameid.py
          python3 tests/test_r3z_four_browser_modes.py
          python3 tests/test_ember_launch.py
          python3 tests/test_ember_paths.py
          python3 tests/test_ember_iop_handoff.py
          python3 tests/test_ember_two_usb_handoff.py
          python3 tests/test_scene_override_nesting.py
          python3 tests/test_gage_alignment.py
          python3 tests/test_modal_animation.py
          python3 tests/test_nested_scissor.py
          python3 tests/test_hdd_manager_browse.py
          python3 tests/test_zack_oct_2026.py
          python3 tests/test_wallpaper_docs.py
          python3 tests/test_r3z_oct15_backport.py
          python3 tests/test_background_only_hotkeys.py
          python3 tests/test_dashboard_present_buffers.py
          python3 tests/test_theme_motion.py
          python3 tests/test_orb_seamless.py
