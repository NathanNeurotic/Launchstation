name: Automated-Build

on:
  workflow_dispatch:
    inputs:
      mirror-drill:
        description: Install without the SDK cache and with the official host unreachable, to prove the mirror fallback
        type: boolean
        default: false
  push:
    branches: [master, main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  # A mirror drill never publishes, so it gets its own group: it must not cancel a publishing run on master.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ inputs.mirror-drill && '-drill' || '' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Launchstation (ps2build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install host test dependencies
        run: |
          python3 -m pip install --user numpy cryptography
          sudo apt-get update -qq
          sudo apt-get install -y -qq libmbedtls-dev

      # The smb: driver (iop/smb2man) built for the host under ASan/UBSan and driven against Samba.
      - name: "Test the smb: driver against Samba (tests/smb2man_live)"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq samba smbclient >/dev/null
          sudo sh tests/smb2man_live/run.sh

      # The memory card SMB server (iop/smbd) built for the host under ASan/UBSan, driven by smbclient.
      - name: "Test the SMB file server with smbclient (tests/smbd_live)"
        run: sh tests/smbd_live/run.sh

