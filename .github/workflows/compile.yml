name: Automated-Build

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Launchstation (ps2build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test Settings sessions, navigation and theme compatibility
        run: |
          python3 tests/test_settings_save_prompt.py
          python3 tests/test_settings_navigation.py
          python3 tests/test_zack_feedback.py
          python3 tests/test_feedback_35_82.py
          python3 tests/test_ilink_browser.py
          python3 tests/test_neutrino_iso.py
          python3 tests/test_ember_launch.py
          python3 tests/test_ember_paths.py
          python3 tests/test_ember_iop_handoff.py
          python3 tests/test_scene_override_nesting.py
          python3 tests/test_gage_alignment.py
          python3 tests/test_modal_animation.py
          python3 tests/test_theme_motion.py
          python3 tests/test_tile_styles.py
          python3 tests/test_worker_queue.py
          python3 tests/test_device_input.py
          python3 tests/test_usb_storage_lifecycle.py
          python3 tests/test_device_autostart_safe_mode.py
          python3 tests/test_home_focus.py
          python3 tests/test_bgm_sidecar.py
          python3 tests/test_poweroff_shutdown.py
          python3 tests/test_mc_card_export.py
          python3 tests/test_mmce_backup.py
          python3 tests/test_opl_title_cfg.py
          python3 tests/test_wle_igr.py
          python3 tests/test_igr_return_policy.py
          python3 tests/test_cloud_relay.py
          python3 tests/test_native_cloud.py
          python3 tests/test_mmce_protocol.py
          python3 tests/test_sd2cloud_parity.py
          python3 tests/test_self_update.py
          python3 tests/test_png_viewer.py

      - name: Validate documentation site
        run: |
          python3 docs-site/build.py --out build/docs-site
          test -f build/docs-site/index.html
          test -f build/docs-site/data/search-index.json

      - name: Install ps2build SDK
        shell: bash
        run: |
          set -euo pipefail
          installer="$(mktemp)"
          trap 'rm -f "$installer"' EXIT

          # git.techwritescode.dev occasionally returns transient 5xx errors.
          # Retry the download before failing the job, and never let a failed
          # curl be hidden by the pipe into sh.
          curl -sSfL \
            --retry 8 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 20 \
            https://git.techwritescode.dev/ps2/install/raw/branch/master/install.sh \
            -o "$installer"

          sh "$installer"
          # The installer places the ps2build executable directly in this
          # directory and adds this directory (not a bin/ subdirectory) to PATH.
          echo "$HOME/.local/share/ps2build" >> "$GITHUB_PATH"

      - name: Verify ps2build
        shell: bash
        run: |
          set -euo pipefail
          command -v ps2build
          ps2build update
          ps2build version

      - name: Provide audsrv if absent from ps2build
        shell: bash
        run: |
          set -euo pipefail
          dest="$HOME/.local/share/ps2build/packages/world/audsrv"
          if [ ! -f "$dest/package.yaml" ]; then
            mkdir -p "$dest"
            cp -r packages/world/audsrv/. "$dest/"
          fi

      - name: Build native cloud TLS
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_cloud_tls.sh

      - name: Build Launchstation with ps2build
        run: |
          ps2build build

      - name: Build optional DS34 controller variant
        run: |
          python3 scripts/configure_ds34.py
          ps2build build -c .ps2-ds34.yaml -o build-ds34

      - name: Verify controller variants in linked ELFs
        run: |
          python3 scripts/check_ds34_build.py \
            "$HOME/.local/share/ps2build/toolchain/ee/bin/mips64r5900el-ps2-elf-nm" \
            build/obj/wLaunchELF/wLaunchELF.unstripped.elf \
            build-ds34/obj/wLaunchELF/wLaunchELF.unstripped.elf

      - name: Report native cloud size
        run: |
          ee_size="$HOME/.local/share/ps2build/toolchain/ee/bin/mips64r5900el-ps2-elf-size"
          echo "== Mbed TLS archives =="
          ls -lh .cloud-deps/lib/libmbedtls.a .cloud-deps/lib/libmbedx509.a .cloud-deps/lib/libmbedcrypto.a
          echo "== Launchstation sections =="
          "$ee_size" build/bin/wLaunchELF.elf || true
          if [ -f build/bin/wLaunchELF-packed.elf ]; then
            ls -lh build/bin/wLaunchELF-packed.elf
          fi

      - name: Check embedded loader low-memory layout
        run: |
          sh scripts/check_loader_layout.sh \
            build/obj/loader/loader.unstripped.elf \
            "$HOME/.local/share/ps2build/toolchain/ee/bin/mips64r5900el-ps2-elf-nm" \
            0x84000 auto auto 0xa0000

      - name: Prepare ELF artifacts
        run: |
          ls -la build/bin/
          if [ ! -f "build/bin/wLaunchELF-packed.elf" ]; then
            echo "Expected build/bin/wLaunchELF-packed.elf was not produced!" >&2
            exit 1
          fi
          mkdir -p artifacts
          cp build/bin/wLaunchELF-packed.elf artifacts/BOOT.ELF
          cp build/bin/wLaunchELF-packed.elf artifacts/Launchstation.ELF
          cp build-ds34/bin/wLaunchELF-packed.elf artifacts/Launchstation-DS34.ELF
          cp build-ds34/bin/wLaunchELF.elf artifacts/Launchstation-DS34-unpacked.ELF
          # Compatibility alias for installations running the previous branded updater.
          cp artifacts/Launchstation.ELF artifacts/r3LaunchELF_ATTDASH.ELF
          cp res/music.sad artifacts/BGM.ADP
          cp res/WLE-CLOUD.CNF.example artifacts/WLE-CLOUD.CNF.example
          cp res/WLE-UPDATE-CA.PEM artifacts/WLE-UPDATE-CA.PEM
          curl -fL --retry 6 --retry-all-errors https://pki.goog/roots.pem -o artifacts/WLE-CLOUD-CA.PEM
          ca_bytes="$(wc -c < artifacts/WLE-CLOUD-CA.PEM)"
          if [ "$ca_bytes" -gt 262144 ]; then
            echo "Google CA bundle is ${ca_bytes} bytes; native cloud loader limit is 262144." >&2
            exit 1
          fi
          if [ -f "build/bin/wLaunchELF.elf" ]; then
            cp build/bin/wLaunchELF.elf artifacts/Launchstation-unpacked.ELF
          fi
          ls -lh artifacts/

      - name: Build offline documentation
        run: |
          python3 docs-site/build.py \
            --out build/docs-site \
            --zip artifacts/Launchstation-Documentation.zip
          unzip -t artifacts/Launchstation-Documentation.zip
          ls -lh artifacts/Launchstation-Documentation.zip

      - name: Build complete release package
        run: |
          set -euo pipefail
          rm -rf build/release-package
          mkdir -p build/release-package
          cp artifacts/BOOT.ELF build/release-package/
          cp artifacts/Launchstation.ELF build/release-package/
          cp artifacts/Launchstation-DS34.ELF build/release-package/
          cp artifacts/Launchstation-DS34-unpacked.ELF build/release-package/
          cp artifacts/r3LaunchELF_ATTDASH.ELF build/release-package/
          cp artifacts/BGM.ADP build/release-package/
          cp artifacts/WLE-CLOUD.CNF.example build/release-package/
          cp artifacts/WLE-CLOUD-CA.PEM build/release-package/
          cp artifacts/WLE-UPDATE-CA.PEM build/release-package/
          cp artifacts/Launchstation-Documentation.zip build/release-package/
          if [ -f artifacts/Launchstation-unpacked.ELF ]; then
            cp artifacts/Launchstation-unpacked.ELF build/release-package/
          fi
          (
            cd build/release-package
            zip -9 -r ../../artifacts/Launchstation-Complete.zip .
          )
          unzip -t artifacts/Launchstation-Complete.zip
          ls -lh artifacts/Launchstation-Complete.zip

      - name: Show artifact hashes
        run: sha256sum artifacts/*

      - name: Upload ELF artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Launchstation
          path: artifacts/
          retention-days: 1

      - name: Publish latest automated pre-release
        # Releases are deliberate: ordinary pushes/PRs only keep the short-lived
        # Actions artifact above. Manual runs or [publish latest] commits refresh the
        # described individual assets plus the complete all-files package.
        if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish latest]'))) && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="latest"
          title="Latest Launchstation automated build"
          notes="$(cat <<EOF
          Automated build for ${GITHUB_SHA} using ps2build.

          ## Which download do I need?

          Want everything in one download? Grab **Launchstation-Complete.zip**. For a minimal normal PS2 install, download **BOOT.ELF**. **Launchstation.ELF** is the same packed executable with the project name instead. The legacy r3LaunchELF_ATTDASH.ELF filename is retained for compatibility. Pre-rename updater builds may need a one-time manual update because their GitHub API request does not follow repository-rename redirects. The remaining files are optional sidecars, debugging files, or documentation.

          | File | What it is | What it does | What it is for |
          | --- | --- | --- | --- |
          | **Launchstation-Complete.zip** | One archive containing all useful files from this release. | Bundles both packed ELF names, the unpacked debug ELF when available, BGM, cloud/update sidecars, and offline documentation. | Best choice when you want the entire release in one download instead of clicking every asset individually. |
          | **BOOT.ELF** | The normal packed PS2 executable. | Runs Launchstation on the PlayStation 2. It is byte-identical to Launchstation.ELF. | Recommended for normal installs, boot managers, FMCB/FHDB setups, USB/MASS launches, and general testing. |
          | **Launchstation.ELF** | The same packed PS2 executable, kept under the project name. | Runs the exact same build as BOOT.ELF. | Use this when you want a descriptive filename instead of BOOT.ELF. You do not need both executables. |
          | **Launchstation-DS34.ELF** | Optional packed build with the inherited PS3/PS4 USB/Bluetooth controller support. | Uses the DS34 controller drivers alongside wired PS2 pads. | Install instead of the standard ELF when you need DS34. Update this variant manually; the native updater selects the standard build. |
          | **Launchstation-DS34-unpacked.ELF** | Uncompressed DS34 build. | Provides the same optional controller support without packing. | Development/debugging only. |
          | **r3LaunchELF_ATTDASH.ELF** | Legacy compatibility name for the same packed executable. | Preserves the old asset name, although older update checks may need one manual upgrade due to the repository API redirect. | Existing users only; new installs should use Launchstation.ELF or BOOT.ELF. |
          | **Launchstation-unpacked.ELF** | The uncompressed development/debug build. | Runs without the normal packing step and is much larger. | Developers and troubleshooting only. Normal users should use BOOT.ELF or Launchstation.ELF. |
          | **BGM.ADP** | Optional PS2 ADPCM background music data. | Enables the dashboard background track when placed beside the boot ELF. Interface sound effects remain available without it. | Users who want dashboard background music. Omit it if you do not want the music. |
          | **WLE-CLOUD.CNF.example** | Example configuration for the native Google Drive client. | Provides the template used to create WLE-CLOUD.CNF with your Google OAuth client ID. | Only users enabling native Google Drive backup/sync. Copy/customize it as WLE-CLOUD.CNF in the dashboard settings folder beside DASHBOARD.CNF. |
          | **WLE-CLOUD-CA.PEM** | Google CA trust-root bundle for HTTPS/TLS. | Lets the native Google Drive client verify Google's TLS certificates securely. | Only users enabling native Google Drive backup/sync; keep it with WLE-CLOUD.CNF in the dashboard settings folder. |
          | **WLE-UPDATE-CA.PEM** | CA trust-root bundle for GitHub HTTPS. | Lets the built-in update checker securely contact GitHub and verify redirected release-asset downloads. | Users who want the dashboard's built-in Check for updates / verified update path; place it in the dashboard settings folder. |
          | **Launchstation-Documentation.zip** | An offline copy of the generated documentation website. | Contains the HTML documentation, assets, and search index for browsing without GitHub Pages. | PC/browser reference and offline documentation; it is not a PS2 executable. |
          | **Source code (zip)** / **Source code (tar.gz)** | GitHub-generated snapshots of this repository at the release commit. | Provide the source tree for building, auditing, or development. | Developers only. These archives are not ready-to-run PS2 builds. |

          ### Minimal normal install

          1. Download **Launchstation-Complete.zip** if you want every release file at once, or **BOOT.ELF** for the minimal executable-only route.
          2. Optionally put **BGM.ADP** beside the ELF for background music.
          3. Add **WLE-UPDATE-CA.PEM** to the dashboard settings folder if you use the built-in update checker.
          4. The updater verifies the ELF against GitHub's published SHA-256 asset digest; no separate checksum text file is required.
          5. Use the WLE-CLOUD files only if you plan to use native Google Drive backup/sync.
          EOF
          )"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$title" --notes "$notes" --target "${GITHUB_SHA}" --prerelease || true
          fi
          for stale in wLaunchELF_R3Z.ELF wLaunchELF_R3Z-unpacked.ELF wLaunchELF_R3Z-Documentation.zip r3LaunchELF_ATTDASH-unpacked.ELF r3LaunchELF_ATTDASH-Documentation.zip r3LaunchELF_ATTDASH-Complete.zip r3LaunchELF_ATTDASH.ELF.sha256 Launchstation.ELF.sha256; do
            gh release delete-asset "$tag" "$stale" -y >/dev/null 2>&1 || true
          done

          gh release upload "$tag" \
            "artifacts/BOOT.ELF#BOOT.ELF — Main packed PS2 executable" \
            "artifacts/Launchstation.ELF#Launchstation.ELF — Same packed build as BOOT.ELF" \
            "artifacts/Launchstation-DS34.ELF#Launchstation-DS34.ELF — Optional PS3/PS4 controller build" \
            "artifacts/Launchstation-DS34-unpacked.ELF#Launchstation-DS34-unpacked.ELF — DS34 development/debug build" \
            "artifacts/r3LaunchELF_ATTDASH.ELF#r3LaunchELF_ATTDASH.ELF — Legacy update compatibility alias" \
            "artifacts/Launchstation-Complete.zip#Launchstation-Complete.zip — Complete release package" \
            "artifacts/BGM.ADP#BGM.ADP — Optional dashboard background music" \
            "artifacts/WLE-CLOUD.CNF.example#WLE-CLOUD.CNF.example — Google Drive OAuth template" \
            "artifacts/WLE-CLOUD-CA.PEM#WLE-CLOUD-CA.PEM — Google Drive TLS trust roots" \
            "artifacts/WLE-UPDATE-CA.PEM#WLE-UPDATE-CA.PEM — GitHub update TLS trust roots" \
            "artifacts/Launchstation-Documentation.zip#Launchstation-Documentation.zip — Offline documentation" \
            --clobber
          if [ -f "artifacts/Launchstation-unpacked.ELF" ]; then
            gh release upload "$tag" \
              "artifacts/Launchstation-unpacked.ELF#Launchstation-unpacked.ELF — Development/debug build" \
              --clobber
          fi

          gh release edit "$tag" --title "$title" --notes "$notes" --target "${GITHUB_SHA}"

      - name: Publish language files release
        if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish latest]'))) && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="language-files"
          title="Translations"
          notes="$(cat <<EOF
          Automated language files for ${GITHUB_SHA}.

          Each **.LNG** download is a Launchstation user-interface translation file. These are data files, not PS2 executables. Download the language(s) you want and place them in the launcher's **Lang/** directory so Launchstation can offer that translation.

          | File | Language | What it is for |
          | --- | --- | --- |
          | **ENG.LNG** | English | English user-interface text. |
          | **FRE.LNG** | French | French user-interface text. |
          | **GER.LNG** | German | German user-interface text. |
          | **HUN.LNG** | Hungarian | Hungarian user-interface text. |
          | **ITA.LNG** | Italian | Italian user-interface text. |
          | **POL.LNG** | Polish | Polish user-interface text. |
          | **POR.LNG** | Portuguese | Portuguese user-interface text. |
          | **PTBR.LNG** | Brazilian Portuguese | Brazilian Portuguese user-interface text. |
          | **SPA.LNG** | Spanish | Spanish user-interface text. |

          GitHub's **Source code (zip)** and **Source code (tar.gz)** entries are repository snapshots for developers and are not language packs or ready-to-run PS2 builds.
          EOF
          )"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes "$notes" --target "${GITHUB_SHA}"
          else
            gh release create "$tag" --title "$title" --notes "$notes" --target "${GITHUB_SHA}"
          fi

          mapfile -d '' assets < <(find Lang -type f -name '*.LNG' -print0)
          for asset in "${assets[@]}"; do
            file="$(basename "$asset")"
            case "$file" in
              ENG.LNG) label="ENG.LNG — English UI translation" ;;
              FRE.LNG) label="FRE.LNG — French UI translation" ;;
              GER.LNG) label="GER.LNG — German UI translation" ;;
              HUN.LNG) label="HUN.LNG — Hungarian UI translation" ;;
              ITA.LNG) label="ITA.LNG — Italian UI translation" ;;
              POL.LNG) label="POL.LNG — Polish UI translation" ;;
              POR.LNG) label="POR.LNG — Portuguese UI translation" ;;
              PTBR.LNG) label="PTBR.LNG — Brazilian Portuguese UI translation" ;;
              SPA.LNG) label="SPA.LNG — Spanish UI translation" ;;
              *) label="${file} — Launchstation UI translation" ;;
            esac
            gh release upload "$tag" "${asset}#${label}" --clobber
          done
