name: Automated-Build

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Launchstation (ps2build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test Settings sessions, navigation and theme compatibility
        run: |
          python3 tests/test_display_feedback.py
          python3 tests/test_udpfs_smap_fifo_tail.py
          python3 tests/test_udpfs_smap_startup.py
          python3 tests/test_pccf.py
          python3 tests/test_pccf_owner.py
          python3 tests/test_pccf_fs.py
          python3 tests/test_copy_short_io.py
          python3 tests/test_copy_pipeline.py
          python3 tests/test_udpfs_directory_errors.py
          python3 tests/test_copy_test_pack.py
          python3 tests/test_transfer_stack_preflight.py
          python3 tests/test_transfer_progress.py
          python3 tests/test_file_operation_overlay.py
          python3 tests/test_neutrino_menu_audio.py
          python3 tests/test_carousel_culling.py
          python3 tests/test_dashboard_languages.py
          python3 tests/test_build_identity.py
          python3 tests/test_clock_save_action.py
          python3 tests/test_storage_probe_frames.py
          python3 tests/test_mmce_bus_restore.py
          python3 tests/test_poweroff_init.py
          python3 tests/test_settings_save_prompt.py
          python3 tests/test_settings_navigation.py
          python3 tests/test_zack_feedback.py
          python3 tests/test_software_clock.py
          python3 tests/test_startup_status.py
          python3 tests/test_transition_latency.py
          python3 tests/test_native_four_browser_modes.py
          python3 tests/test_feedback_35_82.py
          python3 tests/test_ilink_browser.py
          python3 tests/test_neutrino_iso.py
          python3 tests/test_r3z_loader_disable.py
          python3 tests/test_r3z_neutrino_options.py
          python3 tests/test_neutrino_profiles.py
          python3 tests/test_neutrino_cancel_feedback.py
          python3 tests/test_r3z_neutrino_gameid.py
          python3 tests/test_r3z_four_browser_modes.py
          python3 tests/test_ember_launch.py
          python3 tests/test_ember_paths.py
          python3 tests/test_ember_iop_handoff.py
          python3 tests/test_ember_two_usb_handoff.py
          python3 tests/test_scene_override_nesting.py
          python3 tests/test_gage_alignment.py
          python3 tests/test_modal_animation.py
          python3 tests/test_nested_scissor.py
          python3 tests/test_hdd_manager_browse.py
          python3 tests/test_zack_oct_2026.py
          python3 tests/test_wallpaper_docs.py
          python3 tests/test_r3z_oct15_backport.py
          python3 tests/test_background_only_hotkeys.py
          python3 tests/test_dashboard_present_buffers.py
          python3 tests/test_theme_motion.py
          python3 tests/test_orb_seamless.py
          python3 tests/test_tile_styles.py
          python3 tests/test_worker_queue.py
          python3 tests/test_device_input.py
          python3 tests/test_usb_storage_lifecycle.py
          python3 tests/test_usb_iop_pad_handoff.py
          python3 tests/test_zack_storage_drivers.py
          python3 tests/test_dev9_transition.py
          python3 tests/test_mmce_presence_probe.py
          python3 tests/test_usb_probe_status.py
          python3 tests/test_usb_unit_diagnostics.py
          python3 tests/test_mc_poll_usb_barrier.py
          python3 tests/test_usb_browse_cache.py
          python3 tests/test_usb_shared_namespace.py
          python3 tests/test_usb_boot_paths.py
          python3 tests/test_device_autostart_safe_mode.py
          python3 tests/test_home_focus.py
          python3 tests/test_unified_dashboard_navigation.py
          python3 tests/test_files_tab_lifecycle.py
          python3 tests/test_bgm_sidecar.py
          python3 tests/test_sound_recovery.py
          python3 tests/test_poweroff_shutdown.py
          python3 tests/test_mc_card_export.py
          python3 tests/test_mmce_backup.py
          python3 tests/test_mmce_targeted_safety.py
          python3 tests/test_opl_title_cfg.py
          python3 tests/test_wle_igr.py
          python3 tests/test_igr_return_policy.py
          python3 tests/test_cloud_relay.py
          python3 tests/test_native_cloud.py
          python3 tests/test_cloud_history_browser.py
          python3 tests/test_cloud_recovery.py
          python3 tests/test_cloud_menu.py
          python3 tests/test_root_mc_poll.py
          python3 tests/test_pad_icon_order.py
          python3 tests/test_hint_clearance.py
          python3 tests/test_cloud_link_screen.py
          python3 tests/test_project_branding.py
          python3 tests/test_console_region.py
          python3 tests/test_dashboard_console_summary.py
          python3 tests/test_selector_centering.py
          python3 tests/test_zack_round3.py
          python3 tests/test_zack_quickwins.py
          python3 tests/test_mmce_protocol.py
          python3 tests/test_mmce_upstream_contract.py
          python3 tests/test_mmce_restore_txn_model.py
          python3 tests/test_mmce_fs_restore_guard.py
          python3 tests/test_mmce_publish.py
          python3 tests/test_mmce_recovery.py
          python3 tests/test_mmce_native_import.py
          python3 tests/test_mmce_rename_fallback.py
          python3 tests/test_mmce_selectable_install.py
          python3 tests/test_mmce_exclusive_new_files.py
          python3 tests/test_loader_linkfile.py
          python3 tests/test_sd2cloud_parity.py
          python3 tests/test_mmce_status_failures.py
          python3 tests/test_self_update.py
          python3 tests/test_app_packages.py
          python3 scripts/copy_test_pack.py --output test-fixtures/LS-COPY-TEST.zip
          python3 tests/test_rolling_release_workflow.py
          python3 tests/test_release_notes.py
          python3 tests/test_update_sidecar_transaction.py
          python3 tests/test_update_ancestry.py
          python3 tests/test_png_viewer.py

      - name: Validate documentation site
        run: |
          python3 docs-site/build.py --out build/docs-site
          test -f build/docs-site/index.html
          test -f build/docs-site/data/search-index.json

      - name: Install ps2build SDK
        shell: bash
        run: |
          set -euo pipefail
          installer="$(mktemp)"
          trap 'rm -f "$installer"' EXIT

          # git.techwritescode.dev occasionally returns transient 5xx errors.
          # Retry the download before failing the job, and never let a failed
          # curl be hidden by the pipe into sh.
          curl -sSfL \
            --retry 8 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 20 \
            https://git.techwritescode.dev/ps2/install/raw/branch/master/install.sh \
            -o "$installer"

          sh "$installer"
          # The installer places the ps2build executable directly in this
          # directory and adds this directory (not a bin/ subdirectory) to PATH.
          echo "$HOME/.local/share/ps2build" >> "$GITHUB_PATH"

      - name: Verify ps2build
        shell: bash
        run: |
          set -euo pipefail
          command -v ps2build
          ps2build update
          ps2build version

      - name: Provide audsrv if absent from ps2build
        shell: bash
        run: |
          set -euo pipefail
          dest="$HOME/.local/share/ps2build/packages/world/audsrv"
          if [ ! -f "$dest/package.yaml" ]; then
            mkdir -p "$dest"
            cp -r packages/world/audsrv/. "$dest/"
          fi

      - name: Build native cloud TLS
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_cloud_tls.sh

      - name: Embed Launchstation Google Drive client
        env:
          WLE_GOOGLE_CLIENT_ID: ${{ secrets.WLE_GOOGLE_CLIENT_ID }}
          WLE_GOOGLE_CLIENT_SECRET: ${{ secrets.WLE_GOOGLE_CLIENT_SECRET }}
        run: |
          python3 scripts/gen_cloud_client.py

      - name: Build isolated PC CARD CF driver
        run: ps2build build -c iop/pccf/ps2.yaml

      - name: Build Launchstation with ps2build
        run: |
          python3 scripts/gen_githash.py --require-git
          ps2build build

      - name: Build optional DS34 controller variant
        run: |
          python3 scripts/configure_ds34.py
          ps2build build -c .ps2-ds34.yaml -o build-ds34

      - name: Verify controller variants in linked ELFs
        run: |
          python3 scripts/check_ds34_build.py \
            "$HOME/.local/share/ps2build/toolchain/ee/bin/mips64r5900el-ps2-elf-nm" \
            build/obj/wLaunchELF/wLaunchELF.unstripped.elf \
            build-ds34/obj/wLaunchELF/wLaunchELF.unstripped.elf

      - name: Verify source-built UDPFS SMAP and bundled peer ABI
        run: python3 scripts/check_udpfs_smap.py build build-ds34

      - name: Report native cloud size
        run: |
          ee_size="$HOME/.local/share/ps2build/toolchain/ee/bin/mips64r5900el-ps2-elf-size"
          echo "== Mbed TLS archives =="
          ls -lh .cloud-deps/lib/libmbedtls.a .cloud-deps/lib/libmbedx509.a .cloud-deps/lib/libmbedcrypto.a
          echo "== Launchstation sections =="
          "$ee_size" build/bin/wLaunchELF.elf || true
          if [ -f build/bin/wLaunchELF-packed.elf ]; then
            ls -lh build/bin/wLaunchELF-packed.elf
          fi
          # Compare build footprints without stripping features or changing
          # the release publication flow. Sizes are measured after packing.
          {
            echo "### Launchstation ELF footprint (bytes)"
            echo "| Controller variant | Unpacked ELF | Packed ELF |"
            echo "| --- | ---: | ---: |"
            for variant in standard dualshock; do
              if [ "$variant" = standard ]; then dir=build; else dir=build-ds34; fi
              raw="$(stat -c '%s' "$dir/bin/wLaunchELF.elf")"
              packed="$(stat -c '%s' "$dir/bin/wLaunchELF-packed.elf")"
              echo "| $variant | $raw | $packed |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          # Largest symbols (embedded IRX/sounds/fonts, libraries) so ELF size
          # work (#129) targets measured contributors. Report only.
          ee_nm="$HOME/.local/share/ps2build/toolchain/ee/bin/mips64r5900el-ps2-elf-nm"
          echo "== Largest symbols (bytes, hex) =="
          "$ee_nm" --size-sort -S build/obj/wLaunchELF/wLaunchELF.unstripped.elf | tail -n 40 || true

      - name: Check embedded loader low-memory layout
        run: |
          sh scripts/check_loader_layout.sh \
            build/obj/loader/loader.unstripped.elf \
            "$HOME/.local/share/ps2build/toolchain/ee/bin/mips64r5900el-ps2-elf-nm" \
            0x84000 auto auto 0xa0000

      - name: Build installable app packages
        run: |
          python3 scripts/package_apps.py \
            --standard build/bin/wLaunchELF-packed.elf \
            --dualshock build-ds34/bin/wLaunchELF-packed.elf \
            --output artifacts --revision "${GITHUB_SHA}" \
            --epoch "$(git show -s --format=%ct HEAD)"
          python3 tests/test_app_packages.py
          python3 scripts/copy_test_pack.py --output test-fixtures/LS-COPY-TEST.zip

      - name: Upload copy-test fixtures
        uses: actions/upload-artifact@v4
        with:
          name: Launchstation-copy-test
          path: test-fixtures/LS-COPY-TEST.zip
          retention-days: 7

      - name: Show artifact hashes
        run: sha256sum artifacts/*

      - name: Upload app packages
        uses: actions/upload-artifact@v4
        with:
          name: Launchstation
          path: artifacts/
          retention-days: 1

      - name: Publish rolling release from verified master build
        # Each merge (including squash merges) creates a push to master.
        # PRs build review artifacts but must never overwrite public downloads.
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="latest" # Keep existing website and native-updater download URLs.
          assets=(
            APP_LAUNCHSTATION.psu
            APP_LAUNCHSTATION.zip
            APP_LAUNCHSTATION-DS.psu
            APP_LAUNCHSTATION-DS.zip
          )

          # All tests, both EE builds, variant checks, memory layout and
          # ZIP/PSU verification already succeeded before this step starts.
          # Do not touch the release for incomplete or superseded builds.
          for asset in "${assets[@]}"; do
            test -s "artifacts/${asset}" || {
              echo "Missing/empty packaged asset: ${asset}" >&2
              exit 1
            }
          done
          remote_master="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq '.object.sha')"
          if [ "${remote_master}" != "${GITHUB_SHA}" ]; then
            echo "Master moved to ${remote_master}; skipping superseded release ${GITHUB_SHA}."
            exit 0
          fi

          # Keep the rolling tag on the same lineage, as expected by the
          # built-in updater's release-ancestry protection.
          previous_sha=""
          if git rev-parse -q --verify "refs/tags/${tag}^{commit}" >/dev/null; then
            previous_sha="$(git rev-parse "refs/tags/${tag}^{commit}")"
            if ! git merge-base --is-ancestor "${previous_sha}" "${GITHUB_SHA}"; then
              echo "Refusing to move ${tag}: ${previous_sha} is not an ancestor of ${GITHUB_SHA}" >&2
              exit 1
            fi
          fi

          title="Launchstation Rolling - $(date -u +%Y-%m-%d) (${GITHUB_SHA:0:7})"
          notes_file="${RUNNER_TEMP}/launchstation-rolling-notes.md"
          python3 scripts/release_notes.py \
            --repo "${GITHUB_REPOSITORY}" --revision "${GITHUB_SHA}" \
            --previous "${previous_sha}" --run-id "${GITHUB_RUN_ID}" \
            --assets-dir artifacts --output "${notes_file}"

          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" --title "${title}" \
              --notes-file "${notes_file}" --target "${GITHUB_SHA}" --latest
          fi

          # A moving release retains its four canonical asset names so both
          # existing download links and the updater continue to resolve.
          gh release upload "${tag}" \
            "artifacts/${assets[0]}" "artifacts/${assets[1]}" \
            "artifacts/${assets[2]}" "artifacts/${assets[3]}" --clobber

          # Validate that every public asset has the exact packaged byte size
          # before moving the tag or claiming a successful release. Keep any
          # unrelated manually maintained attachments intact.
          verify_dir="${RUNNER_TEMP}/launchstation-published-assets"
          mkdir -p "${verify_dir}"
          for asset in "${assets[@]}"; do
            expected="$(stat -c '%s' "artifacts/${asset}")"
            actual="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
              --jq ".assets[] | select(.name == \"${asset}\") | .size")"
            if [ "${expected}" != "${actual}" ]; then
              echo "Release asset size verification failed: ${asset}, local=${expected}, remote=${actual}" >&2
              exit 1
            fi
            # Download the actual published bytes; a matching length alone
            # does not prove an upload was intact or from this build.
            gh release download "${tag}" --pattern "${asset}" \
              --dir "${verify_dir}" --clobber
            if ! cmp -s "artifacts/${asset}" "${verify_dir}/${asset}"; then
              echo "Release asset content differs from the compiled package: ${asset}" >&2
              exit 1
            fi
          done

          remote_master="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq '.object.sha')"
          if [ "${remote_master}" != "${GITHUB_SHA}" ]; then
            echo "Master advanced during asset upload. Not moving rolling tag to a superseded commit." >&2
            exit 1
          fi

          # Only now point the moving source tag and public release at this
          # exact tested build. Mark it Latest and not a pre-release, like RiptOPL.
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" \
            -f sha="${GITHUB_SHA}" -F force=true
          gh release edit "${tag}" --title "${title}" \
            --notes-file "${notes_file}" --target "${GITHUB_SHA}" \
            --draft=false --prerelease=false --latest
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha')" = "${GITHUB_SHA}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.prerelease')" = "false"
          echo "Published Launchstation Rolling ${GITHUB_SHA} as GitHub Latest."
