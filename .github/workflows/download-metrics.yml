name: Track Launchstation Downloads

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: launchstation-download-metrics-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Verify download-ledger invariants
        run: python3 tests/test_download_metrics.py
      - name: Preserve release asset download counts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/download_metrics.py --repo "$GITHUB_REPOSITORY"
