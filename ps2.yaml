      - padman
      - bdm
      - bdmfs_fatfs
      - usbmass_bd
      - ata_bd
      - libsd
      # SDK audio driver; "audio:audsrv" names its symbols audsrv_irx/size_audsrv_irx for
      # the audsrv-compat client (src/dash_sound.c loads it after libsd).
      - "audio:audsrv"
