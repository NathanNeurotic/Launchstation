# wLaunchELF_R3Z - PS2BUILD project definition.
#
# Build:   ps2build build
# Output:  build/bin/wLaunchELF.elf         (stripped)
#          build/bin/wLaunchELF-packed.elf  (ps2pack compressed, the release ELF)
#
# Default feature profile (formerly the legacy Makefile defaults):
#   MMCE=1 MX4SIO=1 SIO2MAN=1 EXFAT=1 UDPFS=1 ETH=1 DVRP=1 XFROM=1
#   TMANIP=1 IOP_RESET=1 DS34=0 LCDVD=LATEST CUSTOM_COLORS
#
# IOP drivers that the SDK suite already packages are embedded straight from
# PS2BUILD packages (embed_irx). Modules that are wLaunchELF-specific, or that
# the suite does not package (xparam, ata_bd), are built here as iop targets.
# Plain binary payloads (exploit slices, prebuilt UDPFS ministack/ioman) are embedded
# by src/embed_blobs.S. All modules keep the legacy lazy-loading behaviour:
# embedding only places them in the ELF, init.c still decides when to load.

project: wLaunchELF

# Release builds use the PS2BUILD LLVM/Clang toolchain (EE and IOP). Its
# libraries come from packages-llvm, so every EE archive linked here must be
# Clang-built too: Mbed TLS is rebuilt per toolchain by
# scripts/build_cloud_tls.sh; sound uses the SDK audsrv-compat package.
# Override with --toolchain gcc / PS2BUILD_TOOLCHAIN=gcc for comparison.
toolchain: llvm

targets:
  - name: udpfs_smap
    type: iop
    sources: [iop/udpfs_smap/src/main.c, iop/udpfs_smap/src/smap.c, iop/udpfs_smap/src/xfer.c]
    include_dirs: [iop/udpfs_smap/include]
    imports_lst: iop/udpfs_smap/src/imports.lst
    exports_tab: iop/udpfs_smap/src/exports.tab
    cflags: [-Wall, -mno-check-zero-division]
    headers: [dev9, dmacman, intrman, loadcore, modload, stdio, sysclib, threadman]

  - name: pccf
    type: iop
    sources: [iop/pccf/main.c, iop/pccf/pccf_hw.c, iop/pccf/pccf_ata.c, iop/pccf/pcdiag_cis.c, iop/pccf/pcdiag_cf.c]
    include_dirs: [iop/pccf]
    imports_lst: iop/pccf/imports.lst
    defines: [PCCF_SETTLE_US=1000]
    cflags: [-Wall, -fno-strict-aliasing]
    headers: [bdm, iomanx, loadcore, stdio, sysclib, threadman]
  # ------------------------------------------------------------------ IOP --
  - name: usbd_ra
    type: iop
    sources:
      - iop/usbd-ra/src/driver.c
      - iop/usbd-ra/src/hcd.c
      - iop/usbd-ra/src/hub.c
      - iop/usbd-ra/src/interface.c
      - iop/usbd-ra/src/mem.c
      - iop/usbd-ra/src/usbd.c
      - iop/usbd-ra/src/usbio.c
    include_dirs: [iop/usbd-ra/include, iop/usbd-ra/src]
    imports_lst: iop/usbd-ra/src/imports.lst
    exports_tab: iop/usbd-ra/src/exports.tab
    defines:
      - MINI_DRIVER
      - USE_GP_REGISTER=0
    cflags: [-Wall]
    headers: [loadcore, stdio, sysclib, sysmem, intrman, threadman, vblank]

  - name: dev9_poweroff
    type: iop
    sources: [iop/dev9_poweroff/main.c]
    include_dirs: [iop/dev9_poweroff]
    imports_lst: iop/dev9_poweroff/imports.lst
    cflags: [-Wall]
    headers: [dev9, ioman, sysclib]

  - name: allowdvdv
    type: iop
    sources: [iop/AllowDVDV/AllowDVDV.c]
    include_dirs: [iop/AllowDVDV]
    imports_lst: iop/AllowDVDV/imports.lst
    cflags: [-Wall]
    headers: [sysclib, ioman, secrman, cdvd]

  - name: hdl_info
    type: iop
    sources:
      - iop/hdl_info/main.c
      - iop/hdl_info/hdd.c
      - iop/hdl_info/apa.c
      - iop/hdl_info/hdl.c
    include_dirs: [iop/hdl_info, iop/include_compat]
    imports_lst: iop/hdl_info/imports.lst
    exports_tab: iop/hdl_info/exports.tab
    headers: [atad, cdvd, dev9, iomanx, sifcmd, stdio, sysclib, sysmem, threadman, intrman]

  - name: ps2hdd_osd
    type: iop
    sources:
      - iop/ps2hdd_osd/hdd_fio.c
      - iop/ps2hdd_osd/hdd_blkio.c
      - iop/ps2hdd_osd/hdd.c
      - iop/ps2hdd_osd/password.c
      - iop/ps2hdd_osd/misc.c
      - iop/ps2hdd_osd/cache.c
      - iop/ps2hdd_osd/apa.c
      - iop/ps2hdd_osd/journal.c
      - iop/ps2hdd_osd/free.c
    include_dirs: [iop/ps2hdd_osd]
    imports_lst: iop/ps2hdd_osd/imports.lst
    defines:
      - APA_OSD_VER
      - APA_USE_DEV9
      - APA_USE_ATAD
      - IOMANX_OLD_NAME_COMPATIBILITY=0
      - IOMANX_OLD_NAME_ADDDELDRV=0
    cflags: [-Wall]
    headers: [atad, bdm, cdvd, dev9, intrman, iomanx, stdio, sysclib, sysmem, threadman]

  - name: vmcman
    type: iop
    sources:
      - iop/vmcman/src/main.c
      - iop/vmcman/src/mcdev.c
      - iop/vmcman/src/mciomanx_backing.c
      - iop/vmcman/src/mcsio2.c
      - iop/vmcman/src/ps2mc_fio.c
      - iop/vmcman/src/ps1mc_fio.c
    include_dirs: [iop/vmcman/include, iop/vmcman/src]
    imports_lst: iop/vmcman/src/imports.lst
    exports_tab: iop/vmcman/src/exports.tab
    defines:
      - BUILDING_XMCMAN
      - SIO2MAN_V2
      - BUILDING_VMCMAN
      - IOMANX_OLD_NAME_COMPATIBILITY=0
      - IOMANX_OLD_NAME_ADDDELDRV=0
    headers: [cdvd, sior, secrman, sio2man, intrman, ioman, iomanx, loadcore, modload, stdio, sysclib, threadman, timrman]

  - name: mmceman
    type: iop
    sources:
      - iop/mmceman/src/ioplib.c
      - iop/mmceman/src/sio2man_hook.c
      - iop/mmceman/src/mmce_sio2.c
      - iop/mmceman/src/mmce_cmds.c
      - iop/mmceman/src/mmce_fs.c
      - iop/mmceman/src/mmceman.c
    include_dirs: [iop/mmceman/include]
    imports_lst: iop/mmceman/src/imports.lst
    defines:
      - IOMANX_OLD_NAME_COMPATIBILITY=0
      - IOMANX_OLD_NAME_ADDDELDRV=0
    cflags: [-Wall]
    headers: [sio2man, dmacman, intrman, iomanx, loadcore, stdio, sysclib, threadman]

  # The SDK ps2ips target is the EE client library, not an embeddable IRX.
  # Build its matching IOP socket RPC server explicitly under a distinct name.
  - name: ps2ips_rpc
    type: iop
    sources: [iop/ps2ips_rpc/ps2ips.c]
    include_dirs: [iop/ps2ips_rpc]
    imports_lst: iop/ps2ips_rpc/imports.lst
    defines: [PS2IP_DNS]
    cflags: [-Wall]
    headers: [intrman, loadcore, ps2ip-nm, sifcmd, sifman, stdio, sysclib, threadman]

  # Legacy ps2ftpd is retained as the on-demand FTP service. It is compiled
  # into the default build, but init.c does not load the network stack until
  # the user starts Network/FTP.
  - name: ps2ftpd
    type: iop
    sources:
      - iop/oldlibs/ps2ftpd/src/main.c
      - iop/oldlibs/ps2ftpd/src/FileSystem.c
      - iop/oldlibs/ps2ftpd/src/FtpServer.c
      - iop/oldlibs/ps2ftpd/src/FtpClient.c
      - iop/oldlibs/ps2ftpd/src/FtpCommands.c
      - iop/oldlibs/ps2ftpd/src/FtpMessages.c
    include_dirs: [iop/oldlibs/ps2ftpd/src]
    imports_lst: iop/oldlibs/ps2ftpd/src/imports.lst
    cflags: [-Wall, -fno-builtin]
    headers: [cdvd, iomanx, iopmgr, ps2ip-nm, sifcmd, sifman, stdio, sysclib, threadman]

  # PS2Link-compatible host: filesystem server used by the legacy Network
  # command. Like FTP itself, it is embedded but never loaded at boot.
  - name: ps2host
    type: iop
    sources:
      - iop/ps2host/net_fsys.c
      - iop/ps2host/net_fio.c
      - iop/ps2host/ps2host.c
    include_dirs: [iop/ps2host]
    imports_lst: iop/ps2host/imports.lst
    cflags: [-Wall]
    headers: [intrman, ioman, loadcore, ps2ip-nm, sifcmd, stdio, sysclib, threadman]

  # SMB1 client for the smb1: device: OPL's fixed copy of ps2sdk smbman
  # (iop/smbman/README.md), registered as "smb1" so it sits beside
  # smb2man.irx (SMB2/SMB3, prebuilt in iop/__precompiled), which owns "smb".
  - name: smbman
    type: iop
    sources:
      - iop/smbman/smbman.c
      - iop/smbman/smb_fio.c
      - iop/smbman/smb.c
      - iop/smbman/poll.c
      - iop/smbman/auth.c
      - iop/smbman/des.c
      - iop/smbman/md4.c
    include_dirs: [iop/smbman]
    imports_lst: iop/smbman/imports.lst
    # register through iomanX (as pccf/mmceman do), not legacy ioman: an
    # IOP_DT_FSEXT device needs the extended calls (devctl, lseek64 ...)
    defines:
      - SMBMAN_SMB1_DEVICE
      - IOMANX_OLD_NAME_ADDDELDRV=0
    cflags: [-Wall]
    ldflags: ["-lgcc"]
    headers: [intrman, ioman, iomanx, ps2ip-nm, sifman, stdio, sysclib, threadman]

  # ps2sdk iop/deckard/xparam (not packaged by the SDK suite), homebrew DB.
  - name: xparam
    type: iop
    sources:
      - iop/xparam/src/xparam.c
      - iop/xparam/src/database_merged.c
    include_dirs: [iop/xparam/include, iop/xparam/src]
    imports_lst: iop/xparam/src/imports.lst
    headers: [sysclib, loadcore]

  # ps2sdk atad built with ATA_ENABLE_BDM=1 (== upstream ata_bd.irx), which
  # the SDK suite does not package.
  - name: ata_bd
    type: iop
    sources: [iop/ata_bd/src/ps2atad.c]
    include_dirs: [iop/ata_bd/include, iop/ata_bd/src]
    imports_lst: iop/ata_bd/src/imports.lst
    exports_tab: iop/ata_bd/src/exports.tab
    defines:
      - ATA_GAMESTAR_WORKAROUND=1
      - ATA_ENABLE_BDM=1
      - ATA_USE_DEV9=1
    headers: [dev9, bdm, loadcore, stdio, sysclib, threadman]

  # ------------------------------------------------------------------- EE --
  # libiopreboot (SifIopRebootBuffer) is not shipped by the SDK suite.
  - name: iopreboot
    type: ee_lib
    sources: [ee_libs/iopreboot/SifIopRebootBuffer.c, ee_libs/iopreboot/patch_romdrv_set_rom1_info.c]
    defines:
      - F__iopcontrol_special_internals
      - F_SifIopRebootBufferEncrypted
      - F_SifIopRebootBuffer
    headers: [kernel, patches]

  # ps2sdk ee/rpc/hdd (AFL-2.0). The SDK suite ships it as world package
  # "hdd", but the core IOP driver package of the same name shadows it in
  # libs: resolution, so the library is built from source here.
  - name: hdd_ee
    type: ee_lib
    sources: [ee_libs/hdd/libhdd.c]
    include_dirs: [ee_libs/hdd/include]
    headers: [kernel, filexio, poweroff]

  # Embedded ELF loader: linked into the 0x84000..0xa0000 low-memory window,
  # built compact with newlib-nano.
  - name: loader
    type: ee
    sources: [loader/loader.c]
    linkfile: loader/linkfile
    opt: -Os
    cflags: [-fdata-sections, -ffunction-sections]
    ldflags:
      - "-Wl,-zmax-page-size=128"
      - "-Wl,--gc-sections"
      - "-nodefaultlibs"
      - "-Wl,--start-group"
      # Startup now references kernel's _InitSys; scan it inside the group.
      - "-lstartup"
      - "-lc_nano"
      - "-lm_nano"
      - "-lgcc"
      - "-lkernel"
      - "-lcglue"
      - "-lpthread"
      - "-lpthreadglue"
      - "-Wl,--end-group"
    libs: [filexio]

  - name: wle_igr
    type: ee
    sources: [igr/wle_igr.c]
    include_dirs: [include]
    opt: -Os
    cflags: [-fdata-sections, -ffunction-sections]
    ldflags:
      - "-Wl,--gc-sections"
    libs: [filexio, patches]
    embed_irx:
      - iomanx
      - filexio
      - sio2man
      - mcman
      - mcserv
      - mmceman
      - usbd_ra:usbd
      - bdm
      - bdmfs_fatfs
      - usbmass_bd
      - mx4sio_bd
      - iLinkman
      - IEEE1394_bd_mini:IEEE1394_bd
      - dev9:ps2dev9
      - ata_bd
      - ps2hdd_osd:ps2hdd
      - fs:ps2fs

  - name: wLaunchELF
    type: ee
    pack: true
    sources:
      - src/main.c
      - src/main_actions.c
      - src/main_boot.c
      - src/main_modules.c
      - src/main_menu.c
      - src/main_title.c
      - src/main_info_screens.c
      - src/main_console_info.c
      - src/main_gameid.c
