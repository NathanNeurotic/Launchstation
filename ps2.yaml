    include_dirs: [include, ., ee_libs/hdd/include, .cloud-deps/include, .jpeg-deps/include]
    defines:
      - WLE_PS2BUILD
      - NEWLIB_PORT_AWARE
      - LIBCDVD_LATEST
      - XFROM
      - DVRP
      - MMCE
      - MX4SIO
      - ILINK
      - HOMEBREW_SIO2MAN
      - ETH
      - WLE_NATIVE_CLOUD
      - UDPFS
      - SMB
      - TMANIP
      - EXFAT
      - CUSTOM_COLORS
    cflags:
      - -G0
      - "-Wa,-I."
      - "-Wa,-I.."
    ldflags:
      - "-Wl,--no-warn-mismatch"
      - "-L../.cloud-deps/lib"
      # libjpeg-turbo from scripts/build_jpeg.sh, built by the active toolchain.
      - "-L../.jpeg-deps/lib"
    headers: [sior]
    libs: [iopreboot, hdd_ee, gskit, dmakit, png, z, jpegturbo, mc, kbd, mbedtls, mbedx509, mbedcrypto, ps2ips, cglue, m, cdvd, filexio, patches, poweroff, debug, secr, pad, audsrv-compat]
    embed_irx:
      - udpfs_smap
      - loader:loader_elf
      - wle_igr:wle_igr_elf
      - poweroff
      - iomanx
      - filexio
      - dev9:ps2dev9
      - ps2ip-nm:ps2ip
      - smap-ps2ip:ps2smap
      - ps2ips_rpc:ps2ips
      - ps2host
      - smbman
      - netfs:ps2netfs
      - ps2ftpd
      - dev9_poweroff
      - pccf
      - ps2hdd_osd:ps2hdd
      - fs:ps2fs
      # RiptOPL vendored USBD (usbd-ra): ps2sdk pre-rewrite (314d87e7)
      # with MINI_DRIVER and USE_GP_REGISTER=0. Avoids the post-2024-09-04
      # USBD rewrite that drops controller/SIO2 and freezes IOP on real hardware.
      - usbd_ra:usbd
      - mcman
      - mcserv
      - cdfs:cdvd
      - xparam
      - vmcman
      - kbd:ps2kbd
      - hdl_info
      - allowdvdv
      - secrsif
      - xfromman
      - xfromserv
      - extflash
      - atad:ps2atad
      - pvrdrv:dvrdrv
      - dvrfile
      - mmceman
      - mx4sio_bd
      - iLinkman
      - IEEE1394_bd_mini:IEEE1394_bd
