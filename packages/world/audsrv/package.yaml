name: audsrv
origin: ps2sdk
tier: world
license: LGPL-2.0

# world: an RPC-exposed audio service wrapping already-core libsd for
# ergonomics - not a primitive itself. LGPL-2.0, the one non-permissive
# license in an otherwise AFL-2.0/permissive tree (H13) - kept
# physically exiled to this own repo forever, never committed into
# sdk-core or world/ at any point, transiently or otherwise.
# Same "one package, two artifacts, same name for both" pattern as
# cdvd/sior/netman/filexio/sdr.
# Only the IOP driver remains here; the EE client is built from ee_libs/audsrv
# by ps2.yaml so it always matches the ELF's compiler.
artifacts:
  - kind: driver
    target: [iop]
    headers: [libsd,intrman,loadcore,sifcmd,sifrpc,sysclib,sysmem,threadman]
    irx: bin/audsrv.irx
