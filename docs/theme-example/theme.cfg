# wLaunchELF dashboard theme - example
#
# Copy this folder to <dashboard folder>/THEMES/ (the folder that holds
# DASHBOARD.CNF, e.g. mc0:/SYS-CONF/THEMES/Example/) and choose
# Settings > Theme > Load theme from folder.
#
# Every key is optional. Colours: #RRGGBB or #RRGGBBAA (AA = opacity).
# Image paths are relative to this folder unless they name a device.

name = Night Towers
author = wLaunchELF

# start from a built-in preset, then change what you like
preset = towers

# background: solid gradient tunnel mist towers disc orbit clockring grid
#             lines cubes stream tiles brushed wave crystal image
background = towers
background_color = #8C8AB4
background_color2 = #1E3C8C
brightness = 85
scanlines = 0
# image = background.png      (used by background = image)

text = #ECEEF4
text_secondary = #9CA2B2
text_muted = #646A7C
text_selected = #76D6FF
accent = #54C4FA
accent2 = #968CFF
selection = #1E6E9C96
warning = #FFCC5C
error = #FF626E
success = #5CDC96
panel = #02030AB4
border = #FFFFFF10

highlight = bar
# Application shell, independent of panel corners.
tile_style = memory_card
corners = soft
glow = 0

font = roboto
font_scale = 100
bold = 0
text_shadow = 1

icon_tint = text
app_icon_style = system
# app_icon = app.png

clock = system
clock_position = header
clock_hours = system
clock_seconds = 1
clock_date = system

wallpaper = off
wallpaper_dim = 65
